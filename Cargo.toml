[workspace]
members = ["crates/*"]
exclude = ["apps/legion-app/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

# Every version is named once, here; a crate takes what it needs with `workspace = true`.
[workspace.dependencies]
legion-proto = { path = "crates/legion-proto" }
legion-link = { path = "crates/legion-link" }
legion-content = { path = "crates/legion-content" }
legion-core = { path = "crates/legion-core" }
legion-net = { path = "crates/legion-net" }
legion-tools = { path = "crates/legion-tools" }
legion-update = { path = "crates/legion-update" }
legion-xfer = { path = "crates/legion-xfer" }
bytes = "1.12.2"
http = "1.5.0"
dunce = "1.0.5"
# Verifies offline Ed25519 release signatures over SHA256SUMS against the compiled-in public key.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast"] }
gethostname = "1.1.0"
jiff = { version = "1.0.2", default-features = false, features = ["std"] }
libc = "0.2.191"
process-wrap = { version = "10.0.1", default-features = false }
# In-process SSH client for mobile and app controllers (behind legion-link's `ssh` feature).
# Uses the `ring` crypto backend rather than `aws-lc-rs` so cross-compilation to Android NDK and
# iOS needs only a C compiler and no cmake or bindgen.
russh = { version = "0.65.4", default-features = false, features = ["ring", "rsa"] }
same-file = "1.0.6"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
# preserve_order keeps a result's fields in the order its type declares them, which is the order a
# person reads them in.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
socket2 = "0.6.5"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-util = "0.7.20"
toml = "1.2.2"
# Edits fleet.toml and projects.toml in place, keeping the comments and layout a person gave them.
toml_edit = { version = "0.25.20", default-features = false, features = ["parse", "display"] }
unicode-normalization = "0.1.26"
windows = { version = "0.62.2", default-features = false }
zeroize = "1.9.2"
legion-os = { path = "crates/legion-os" }
nix = { version = "0.32.0", default-features = false, features = ["signal"] }
# Only what sys.info and sys.procs read: CPUs, memory and processes, disks, and user names.
sysinfo = { version = "0.40.4", default-features = false, features = ["system", "disk", "user"] }
base64 = "0.23.1"
blake3 = "1.8.7"
# The operating system's randomness, for the HTTP door's tokens.
getrandom = "0.4.3"
globset = "0.4.22"
ignore = "0.4.35"
# Pure-Rust image decoders/encoders for fs.thumb: only the five supported raster formats, no rayon.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
# Pure-Rust QR encoder (no image/svg features) for terminal pairing codes in `legion pair`.
qrcode = { version = "0.15.0", default-features = false }
regex = "1.13.2"
legion-doors = { path = "crates/legion-doors" }
# The official MCP SDK; it speaks the revisions with and without the initialize handshake.
rmcp = { version = "3.11.0", default-features = false }
# The HTTP door: axum routes, hyper serves each connection so its timeouts and shutdown are ours,
# http-body for the event stream's body. The versions are the ones rmcp's HTTP transport uses.
axum = { version = "0.8.9", default-features = false }
http-body = "1.1.0"
hyper = { version = "1.13.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["service", "tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# A panic in a long-lived node takes every session with it, so the ways to write one by accident
# are flagged; the few deliberate ones say why where they stand.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
# Every fallible function returns the one ErrorBody every door hands to callers, about 150 bytes.
# Failing is the rare path and the type crosses crate and process boundaries as a plain value, so
# boxing it everywhere would cost readability for no measurable gain.
result_large_err = "allow"

[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.bytemuck]
opt-level = 3
[profile.dev.package.color_quant]
opt-level = 3

[profile.release]
# Produce a small, stripped static binary for fleet distribution. `panic` is intentionally left at
# the default `unwind` rather than `abort` because a long-lived server (`legion serve`, `legion
# rpc`, `legion mcp`) must survive a panicking call without taking down every active session.
lto = true
codegen-units = 1
strip = true
