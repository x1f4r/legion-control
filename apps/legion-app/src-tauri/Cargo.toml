[workspace]

[package]
name = "legion-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false
description = "Legion native shell for phones, tablets and desktops"

[lib]
name = "legion_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Enables pre-selected local upload paths in debug automated tests only. Never enabled in release
# or standard debug builds so the web view can only upload files explicitly chosen via the native
# system file picker.
test-upload-paths = []

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
getrandom = "0.4.3"
http = "1.5.0"
http-body = "1.1.0"
hyper = { version = "1.13.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
legion-content = { path = "../../../crates/legion-content" }
legion-link = { path = "../../../crates/legion-link", features = ["ssh"] }
legion-update = { path = "../../../crates/legion-update" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tauri = { version = "=2.12.7", features = [] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = "0.7.20"

[target.'cfg(not(target_os = "android"))'.dependencies]
gethostname = "1.1.0"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
log = "0.4.35"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "=2.5.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
flate2 = "1.1.11"
legion-link = { path = "../../../crates/legion-link", features = ["ssh", "local"] }
open = { version = "5.4.5", features = ["shellexecute-on-windows"] }
rfd = { version = "0.15.4", default-features = false, features = ["gtk3"] }
tar = "0.4.46"
tauri-plugin-single-instance = "=2.5.5"

[dev-dependencies]
ed25519-dalek = "3.0.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
result_large_err = "allow"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
