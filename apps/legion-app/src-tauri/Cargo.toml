[workspace]

[package]
name = "legion-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false
description = "Legion native shell for phones, tablets and desktops"

[lib]
name = "legion_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
base64 = "0.23.1"
legion-link = { path = "../../../crates/legion-link", features = ["ssh"] }
legion-update = { path = "../../../crates/legion-update" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tauri = { version = "=2.12.7", features = [] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["sync", "time"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
gethostname = "1.1.0"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
log = "0.4.35"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "process"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "=2.5.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
flate2 = "1.1.11"
legion-link = { path = "../../../crates/legion-link", features = ["ssh", "local"] }
tar = "0.4.46"
tauri-plugin-single-instance = "=2.5.5"

[dev-dependencies]
ed25519-dalek = "3.0.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
result_large_err = "allow"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
