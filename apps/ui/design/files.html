<title>Legion interface: Files reference screens</title>
<link rel="stylesheet" href="../styles.css">
<style>
  /* Laying the reference screens out side by side. Nothing in this block ships. */
  body { padding: 28px; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; background: #000; height: auto; }
  .frame { position: relative; width: 390px; height: 820px; border-radius: 30px; overflow: hidden; outline: 1px solid #333; }
  .frame .shell { height: 100%; }
  figcaption { font: 12px ui-monospace, monospace; color: #888; margin: 0 0 8px 6px; max-width: 380px; }
  figure { margin: 0; }
  .ph { display: block; background-image: linear-gradient(135deg, var(--a, #3b5d7a), var(--b, #1c2a3a)); }
</style>
<style>
  /* ── New for Files. Everything in this block moves into styles.css as it is built. ─────────── */

  /* A row that starts with a picture of what it is. */
  .row .thumb {
    flex: none;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border-radius: 9px;
    background: var(--raised);
    color: var(--dim);
    overflow: hidden;
  }
  .row .thumb svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .row .thumb.folder { color: var(--accent); }
  .row .thumb img, .row .thumb .ph { width: 100%; height: 100%; object-fit: cover; }
  .row .star { color: var(--accent); font-size: 13px; }
  .row.picked { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .row .check { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-strong); }
  .row.picked .check { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 4px var(--surface); }

  /* The path, first thing in the scrolling area and stuck to its top; the last part is where you are. */
  .where { position: sticky; top: -4px; z-index: 1; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: -4px calc(var(--pad) * -1) 6px; padding: 4px var(--pad) 8px; background: var(--bg); font-size: var(--text-sub); color: var(--dim); white-space: nowrap; }
  .where a { color: inherit; text-decoration: none; }
  .where a:last-child { color: var(--text); }
  .where i { font-style: normal; color: var(--faint); }

  /* Pictures and video as a grid. Three across on a phone, more as the shell widens. */
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; margin: 0 calc(var(--pad) * -1 + 3px); }
  .grid .cell { position: relative; aspect-ratio: 1; overflow: hidden; border-radius: 4px; background: var(--raised); }
  .grid .cell > * { display: block; width: 100%; height: 100%; object-fit: cover; }
  .grid .cell .len { position: absolute; right: 5px; bottom: 5px; width: auto; height: auto; padding: 2px 6px; border-radius: 5px; background: rgb(0 0 0 / 0.6); color: #fff; font: 500 11px/1.3 var(--sans); }
  .grid .cell.folder { display: grid; place-items: center; align-content: center; gap: 6px; color: var(--dim); font-size: var(--text-small); text-align: center; padding: 6px; }
  .grid .cell.folder svg { width: 30px; height: 30px; stroke: var(--accent); fill: none; stroke-width: 1.6; }

  /* The dock when it holds a search box and tools, and when it holds actions for a selection. */
  .dock.tools { display: flex; gap: 6px; align-items: center; }
  .dock.tools .input { flex: 1; min-width: 0; }
  .bar4 { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
  .bar4 button { display: grid; justify-items: center; gap: 4px; min-height: 54px; padding: 8px 2px 6px; border: 0; border-radius: 10px; background: none; color: var(--text); font-size: 11px; cursor: pointer; }
  .bar4 button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .bar4 button.danger { color: var(--bad); }
  .bar4 button[disabled] { color: var(--faint); }

  /* Kind filters above the search box: they scroll sideways and never wrap. */
  .filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 0 0 8px; }
  .filters button { flex: none; height: 32px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 16px; background: none; color: var(--dim); font-size: var(--text-sub); }
  .filters button[aria-pressed="true"] { border-color: var(--accent); color: var(--text); background: color-mix(in srgb, var(--accent) 14%, transparent); }

  /* The viewer covers everything, on black, with its actions at the bottom. */
  .viewer { position: absolute; inset: 0; z-index: 40; display: grid; grid-template-rows: auto 1fr auto; background: #000; color: #fff; }
  .viewer-top { display: flex; align-items: center; gap: 4px; padding: calc(var(--safe-top) + 10px) 8px 8px; }
  .viewer-top .name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .viewer-top .name small { display: block; font-weight: 400; font-size: var(--text-small); color: #aaa; }
  .viewer-top .btn { color: #fff; }
  .viewer-stage { min-height: 0; display: grid; place-items: center; overflow: hidden; }
  .viewer-stage .said { max-width: 280px; text-align: center; color: #ccc; }
  .viewer-stage .said strong { display: block; color: #fff; font-size: 17px; margin-bottom: 6px; }
  .viewer-bar { padding: 6px 10px calc(var(--safe-bottom) + 8px); background: linear-gradient(transparent, rgb(0 0 0 / 0.7)); }
  .viewer-bar .bar4 button { color: #fff; }
  .player { width: 100%; background: #111; aspect-ratio: 16 / 9; position: relative; }
  .player .ctl { position: absolute; left: 12px; right: 12px; bottom: 10px; display: grid; gap: 6px; font: 500 12px/1 var(--sans); color: #ddd; }
  .player .ctl .track { height: 3px; border-radius: 2px; background: #555; }
  .player .ctl .track i { display: block; width: 38%; height: 100%; border-radius: 2px; background: #fff; }

  /* How far along something is, under a row's title. */
  .row .progress { display: block; height: 3px; margin-top: 7px; border-radius: 2px; background: var(--raised); overflow: hidden; }
  .row .progress i { display: block; height: 100%; width: calc(var(--v) * 1%); background: var(--accent); }

  .tile .thumb { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; background: var(--raised); color: var(--accent); overflow: hidden; }
  .tile .thumb svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; }
  .tile strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile span { font-size: var(--text-sub); color: var(--dim); }
</style>
