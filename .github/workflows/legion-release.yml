# Legion release build workflow.
#
# Trust model: the offline Ed25519 signature (`SHA256SUMS.sig`, verified against the public key
# compiled into `legion` from `contract/release-public-key.pem`) is the trust anchor. This workflow
# never holds the signing key and never signs releases; the GitHub build provenance attestation is
# defence in depth for installers and operators verifying CI provenance.
#
# Release procedure (owner):
#   1. Bump `[workspace.package].version` in Cargo.toml on `main` and wait for CI to turn green.
#   2. Tag that commit on `main` and push the tag:
#        git tag legion-vX.Y.Z && git push origin legion-vX.Y.Z
#   3. Wait for this workflow to finish building all targets, attesting them, and creating the
#      draft release (with `--latest=false` so `/releases/latest` stays untouched for older apps).
#   4. Sign `SHA256SUMS` offline on the machine holding `~/.legion-control/release-signing.key`:
#        node scripts/sign-legion-release.mjs legion-vX.Y.Z
#   5. Review the listed artifacts/digests and run the publish command printed by the script:
#        gh release edit legion-vX.Y.Z --draft=false --latest=false
name: Legion release
on:
  push:
    tags:
      - 'legion-v*'
  # A manual run builds every target and publishes the combined workflow artifact with SHA256SUMS,
  # without creating a GitHub release or provenance attestation.
  workflow_dispatch:
permissions:
  contents: read
# Keep tag releases from colliding while letting manual dry runs execute side by side.
concurrency:
  group: legion-release-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'tag' }}
  cancel-in-progress: false
# Every action is pinned to the commit of the release named beside it, matching checks.yml.
jobs:
  prepare:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_release: ${{ steps.version.outputs.is_release }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      # Full history lets the tag-push check verify the tagged commit is reachable from `main`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Refuse a tag whose version disagrees with Cargo.toml or whose commit is not on `main`
      # before spending runner minutes on cross-platform release builds.
      - id: version
        name: Check tag against workspace Cargo.toml and main
        shell: bash
        run: |
          set -euo pipefail
          workspace_version="$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/ { in_section = 0 }
            in_section && /^version[[:space:]]*=/ {
              gsub(/^[^"]*"|".*$/, "")
              print
              exit
            }
          ' Cargo.toml)"
          if [[ -z "$workspace_version" ]]; then
            echo "Could not read [workspace.package].version from Cargo.toml." >&2
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
            tag_version="${tag#legion-v}"
            if [[ "$tag_version" != "$workspace_version" ]]; then
              echo "Tag ${tag} (version ${tag_version}) does not match Cargo.toml workspace version ${workspace_version}." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "Tag ${tag} ($(git rev-parse --short HEAD)) is not on origin/main; refusing to build a release from an unmerged commit." >&2
              exit 1
            fi
            is_release="true"
          else
            tag="legion-v${workspace_version}"
            is_release="false"
          fi
          if [[ "$workspace_version" == *-* ]]; then
            is_prerelease="true"
          else
            is_prerelease="false"
          fi
          echo "version=${workspace_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "is_release=${is_release}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${is_prerelease}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            ext: ''
            use_zigbuild: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            ext: ''
            use_zigbuild: true
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ''
            use_zigbuild: false
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ''
            use_zigbuild: false
          # aarch64-pc-windows-msvc is omitted: blake3 compiles C code, and windows-latest does not
          # preinstall the MSVC ARM64 C++ build tools.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: '.exe'
            use_zigbuild: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
      # blake3 compiles C sources; musl-tools supplies musl-gcc so the native x86_64 musl build
      # links cleanly against musl rather than picking up host glibc fortify symbols.
      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends musl-tools
      # aarch64-unknown-linux-musl cross-compiles C code in blake3 through zig and cargo-zigbuild
      # so it produces a fully static binary on an x86_64 runner.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: matrix.use_zigbuild
        with:
          version: '0.15.1'
      # Release builds never restore cached build trees (`target/`) or cached executables; install
      # the pinned cargo-zigbuild fresh on every release run.
      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked cargo-zigbuild --version 0.24.1
      - name: Build release binary (zigbuild)
        if: matrix.use_zigbuild
        shell: bash
        env:
          LEGION_BUILD_REV: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo zigbuild --release --locked --target "${{ matrix.target }}" -p legion-cli
      - name: Build release binary (Windows static CRT)
        if: runner.os == 'Windows'
        shell: bash
        env:
          # Statically link the MSVC C runtime so target Windows machines need no VC++ redistributable.
          RUSTFLAGS: -C target-feature=+crt-static
          LEGION_BUILD_REV: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${{ matrix.target }}" -p legion-cli
      - name: Build release binary (native)
        if: ${{ !matrix.use_zigbuild && runner.os != 'Windows' }}
        shell: bash
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          LEGION_BUILD_REV: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${{ matrix.target }}" -p legion-cli
      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          src="target/${{ matrix.target }}/release/legion${{ matrix.ext }}"
          dest="dist/legion-${{ needs.prepare.outputs.version }}-${{ matrix.target }}${{ matrix.ext }}"
          cp "$src" "$dest"
          test -s "$dest"
          ls -lh "$dest"
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            file "$dest"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-${{ matrix.target }}
          path: dist/legion-${{ needs.prepare.outputs.version }}-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  package:
    name: Generate checksums
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: legion-*
          merge-multiple: true
          path: dist
      - name: Write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          LC_ALL=C sha256sum legion-* > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-release-${{ needs.prepare.outputs.version }}
          path: dist/
          if-no-files-found: error

  release:
    name: Create draft release
    needs: [prepare, package]
    if: ${{ needs.prepare.outputs.is_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Full history is needed so release notes can find the previous legion-v* tag and list the
      # commits since it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: legion-release-${{ needs.prepare.outputs.version }}
          path: dist
      - name: Verify checksums before publishing
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Build release notes and publish draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          version="${{ needs.prepare.outputs.version }}"
          prev_tag="$(git tag --list 'legion-v*' --merged "${tag}^" --sort=-v:refname | grep -Fxv "$tag" | head -n 1 || true)"
          {
            if [[ -n "$prev_tag" ]]; then
              echo "## Changes since ${prev_tag}"
              echo
              git log --no-merges --format='- %s (%h)' "${prev_tag}..${tag}"
            else
              echo "## Changes"
              echo
              git log --no-merges --format='- %s (%h)' "${tag}" -- Cargo.toml Cargo.lock crates/ install/ .github/workflows/legion-release.yml
            fi
          } > release-notes.md
          # Always pass --latest=false so publishing a Legion release never moves `/releases/latest`,
          # which the older Mac and Android apps read for their own updates.
          create_args=(
            "$tag"
            --draft
            --latest=false
            --verify-tag
            --title "Legion v${version}"
            --notes-file release-notes.md
          )
          if [[ "${{ needs.prepare.outputs.is_prerelease }}" == "true" ]]; then
            create_args+=(--prerelease)
          fi
          gh release create "${create_args[@]}" dist/*
