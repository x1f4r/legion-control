name: Legion App
on:
  push:
    branches: [main, app/platforms]
    paths:
      - 'apps/**'
      - 'crates/**'
      - '.github/workflows/legion-app.yml'
      - 'rust-toolchain.toml'
  pull_request:
    paths:
      - 'apps/**'
      - 'crates/**'
      - '.github/workflows/legion-app.yml'
      - 'rust-toolchain.toml'
  workflow_dispatch:
    inputs:
      job:
        description: 'Run all jobs or a single platform job'
        type: choice
        default: all
        options:
          - all
          - rust-check
          - android
          - linux-desktop
          - ios
          - macos-desktop
          - windows-desktop
permissions:
  contents: read
# A newer push to a pull request or feature branch supersedes the run still going on it; every push
# to main runs to completion in its own concurrency group.
concurrency:
  group: legion-app-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}
# Every action is pinned to the commit of the release named beside it, matching checks.yml.
jobs:
  rust-check:
    name: Rust check (Linux)
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'rust-check'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install
      - name: Install Linux WebKitGTK and GTK build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            build-essential
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/legion-app/src-tauri/target/
          key: legion-app-check-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'apps/legion-app/src-tauri/Cargo.lock') }}
          restore-keys: legion-app-check-${{ runner.os }}-
      - name: Format, clippy and unit tests
        run: |
          cargo fmt --manifest-path apps/legion-app/src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path apps/legion-app/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path apps/legion-app/src-tauri/Cargo.toml --locked

  android:
    name: Android debug APK and emulator
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            apps/legion-app/src-tauri/gen/android/*.gradle*
            apps/legion-app/src-tauri/gen/android/app/*.gradle*
            apps/legion-app/src-tauri/gen/android/buildSrc/**/*.gradle*
            apps/legion-app/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install Android platform, build-tools and NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Install Rust and Android targets
        run: |
          rustup toolchain install
          rustup target add \
            aarch64-linux-android \
            x86_64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: legion-app-tauri-cli-${{ runner.os }}-2.12.6-${{ hashFiles('rust-toolchain.toml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/legion-app/src-tauri/target/
          key: legion-app-android-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'apps/legion-app/src-tauri/Cargo.lock') }}
          restore-keys: legion-app-android-${{ runner.os }}-
      - name: Install tauri-cli 2.12.6
        run: |
          set -euo pipefail
          if [ "$(cargo tauri --version 2>/dev/null || true)" != "tauri-cli 2.12.6" ]; then
            cargo install tauri-cli --version =2.12.6 --locked
          fi
      - name: Build Android debug APK (arm64 + x86_64)
        working-directory: apps/legion-app
        run: cargo tauri android build --debug --apk --target aarch64 --target x86_64
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write Android emulator verification script
        run: |
          cat << 'EOF' > "$RUNNER_TEMP/verify-android.sh"
          #!/usr/bin/env bash
          set -euo pipefail
          APK="apps/legion-app/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          mkdir -p ci-shots/android
          adb install -r "$APK"
          adb logcat -c
          adb shell cmd uimode night yes
          adb shell am start -W -n com.x1f4r.legion/.MainActivity
          FOUND=0
          for i in $(seq 1 90); do
            if adb logcat -d -s legion-app:I | grep -q "legion-app: interface ready"; then
              echo "Android interface ready after ${i}s"
              adb logcat -d -s legion-app:I | grep "legion-app: interface ready"
              FOUND=1
              break
            fi
            sleep 1
          done
          if [ "$FOUND" -ne 1 ]; then
            echo "Timed out waiting for Android ready marker. Recent logcat:"
            adb logcat -d -t 150
            adb exec-out screencap -p > ci-shots/android/android-timeout.png || true
            exit 1
          fi
          sleep 2
          adb exec-out screencap -p > ci-shots/android/android-dark.png
          adb shell cmd uimode night no
          sleep 2
          adb exec-out screencap -p > ci-shots/android/android-light.png
          ls -lh ci-shots/android/
          EOF
          chmod +x "$RUNNER_TEMP/verify-android.sh"
      - name: Boot Android emulator, verify ready marker and capture screenshots
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$RUNNER_TEMP/verify-android.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-android-debug-apk
          path: apps/legion-app/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-android-screenshots
          path: ci-shots/android/*.png
          if-no-files-found: error

  linux-desktop:
    name: Linux desktop bundles
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'linux-desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install
      - name: Install Linux Tauri bundle and headless display dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            file \
            curl \
            build-essential \
            xvfb \
            dbus-x11
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: legion-app-tauri-cli-${{ runner.os }}-2.12.6-${{ hashFiles('rust-toolchain.toml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/legion-app/src-tauri/target/
          key: legion-app-linux-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'apps/legion-app/src-tauri/Cargo.lock') }}
          restore-keys: legion-app-linux-${{ runner.os }}-
      - name: Install tauri-cli 2.12.6
        run: |
          set -euo pipefail
          if [ "$(cargo tauri --version 2>/dev/null || true)" != "tauri-cli 2.12.6" ]; then
            cargo install tauri-cli --version =2.12.6 --locked
          fi
      - name: Build deb and AppImage bundles
        working-directory: apps/legion-app
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: cargo tauri build --bundles deb,appimage
      - name: Launch Linux app under Xvfb and verify ready marker
        run: |
          set -euo pipefail
          READY_FILE="$RUNNER_TEMP/legion-linux-ready.txt"
          rm -f "$READY_FILE"
          LEGION_APP_READY_FILE="$READY_FILE" \
          WEBKIT_DISABLE_DMABUF_RENDERER=1 \
          WEBKIT_DISABLE_COMPOSITING_MODE=1 \
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" \
            apps/legion-app/src-tauri/target/release/legion-app \
            >"$RUNNER_TEMP/legion-linux.log" 2>&1 &
          APP_PID=$!
          FOUND=0
          for i in $(seq 1 60); do
            if [ -f "$READY_FILE" ] && grep -q "legion-app: interface ready" "$READY_FILE"; then
              echo "Linux desktop ready after ${i}s: $(cat "$READY_FILE")"
              FOUND=1
              break
            fi
            sleep 1
          done
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true
          cat "$RUNNER_TEMP/legion-linux.log" || true
          [ "$FOUND" -eq 1 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-linux-bundles
          path: |
            apps/legion-app/src-tauri/target/release/bundle/deb/*.deb
            apps/legion-app/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  ios:
    name: iOS and iPadOS
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'ios'
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and iOS targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: legion-app-tauri-cli-${{ runner.os }}-2.12.6-${{ hashFiles('rust-toolchain.toml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/legion-app/src-tauri/target/
          key: legion-app-ios-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'apps/legion-app/src-tauri/Cargo.lock') }}
          restore-keys: legion-app-ios-${{ runner.os }}-
      - name: Install tauri-cli 2.12.6
        run: |
          set -euo pipefail
          if [ "$(cargo tauri --version 2>/dev/null || true)" != "tauri-cli 2.12.6" ]; then
            cargo install tauri-cli --version =2.12.6 --locked
          fi
      - name: Build iOS simulator app
        working-directory: apps/legion-app
        run: |
          set -euo pipefail
          cargo tauri ios build --target aarch64-sim --no-sign --ci
          find src-tauri/gen/apple/build -maxdepth 4 -name '*.app'
      - name: Boot iPhone and iPad simulators, verify ready marker and capture screenshots
        run: |
          set -euo pipefail
          SIM_APP="$(find apps/legion-app/src-tauri/gen/apple/build -maxdepth 4 -name 'Legion.app' | head -n 1)"
          test -d "$SIM_APP"
          echo "Using simulator app: $SIM_APP"

          mkdir -p ci-shots/ios

          read -r IPHONE_UDID IPHONE_NAME IPAD_UDID IPAD_NAME < <(python3 - << 'PY'
          import json, re, subprocess, sys

          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"], text=True))
          def runtime_key(rt):
              return [int(x) for x in re.findall(r'\d+', rt)]

          ios_runtimes = sorted(
              [rt for rt in data.get("devices", {}) if "SimRuntime.iOS-" in rt],
              key=runtime_key,
              reverse=True,
          )
          for rt in ios_runtimes:
              devs = [d for d in data["devices"][rt] if d.get("isAvailable")]
              iphones = [d for d in devs if d["name"].startswith("iPhone")]
              ipads = [d for d in devs if d["name"].startswith("iPad")]
              if iphones and ipads:
                  iphones.sort(key=lambda d: (0 if "Pro" not in d["name"] and "SE" not in d["name"] and "e" not in d["name"].split()[-1] else 1, d["name"]))
                  ipads.sort(key=lambda d: (0 if "Air" in d["name"] or "Pro" in d["name"] else 1, d["name"]))
                  ip = iphones[0]
                  pd = ipads[0]
                  print(ip["udid"], ip["name"].replace(" ", "_"), pd["udid"], pd["name"].replace(" ", "_"))
                  sys.exit(0)
          sys.exit("No available iOS simulator runtime with both iPhone and iPad devices found.")
          PY
          )

          echo "Selected iPhone: $IPHONE_NAME ($IPHONE_UDID)"
          echo "Selected iPad: $IPAD_NAME ($IPAD_UDID)"

          run_simulator() {
            local kind="$1"
            local udid="$2"
            local dev_name="$3"

            echo "=== Running on $kind ($dev_name / $udid) ==="
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$SIM_APP"

            local data_dir ready_file stdout_log stderr_log
            data_dir="$(xcrun simctl get_app_container "$udid" com.x1f4r.legion data)"
            mkdir -p "$data_dir/tmp"
            ready_file="$data_dir/tmp/legion-ready.txt"
            stdout_log="$RUNNER_TEMP/legion-${kind}-stdout.log"
            stderr_log="$RUNNER_TEMP/legion-${kind}-stderr.log"
            rm -f "$ready_file" "$stdout_log" "$stderr_log"

            xcrun simctl ui "$udid" appearance dark
            local launch_out app_pid
            launch_out="$(SIMCTL_CHILD_LEGION_APP_READY_FILE="$ready_file" \
              xcrun simctl launch --stdout="$stdout_log" --stderr="$stderr_log" "$udid" com.x1f4r.legion)"
            echo "$launch_out"
            app_pid="$(printf '%s\n' "$launch_out" | awk '{print $2}')"

            local found=0
            for i in $(seq 1 60); do
              if [ -f "$ready_file" ] && grep -q "legion-app: interface ready" "$ready_file"; then
                echo "$kind interface ready (file) after ${i}s: $(cat "$ready_file")"
                found=1
                break
              fi
              if [ -f "$stdout_log" ] && grep -q "legion-app: interface ready" "$stdout_log"; then
                echo "$kind interface ready (stdout) after ${i}s"
                found=1
                break
              fi
              if [ -n "$app_pid" ] && ! kill -0 "$app_pid" 2>/dev/null; then
                echo "$kind app process $app_pid exited after ${i}s"
                break
              fi
              sleep 1
            done
            echo "--- $kind stdout ---"
            cat "$stdout_log" || true
            echo "--- $kind stderr ---"
            cat "$stderr_log" || true
            if [ "$found" -ne 1 ]; then
              echo "Failed waiting for $kind ready marker at $ready_file"
              ls -la "$data_dir/Library/Application Support" || true
              xcrun simctl io "$udid" screenshot "ci-shots/ios/${kind}-timeout.png" || true
              echo "--- DiagnosticReports ---"
              ls -lt "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | head -n 20 || true
              local latest_crash
              latest_crash="$(ls -t "$HOME/Library/Logs/DiagnosticReports"/Legion* 2>/dev/null | head -n 1 || true)"
              if [ -n "$latest_crash" ]; then
                echo "=== Crash report: $latest_crash ==="
                head -n 160 "$latest_crash" || true
              fi
              echo "--- CoreSimulator logs ---"
              xcrun simctl spawn "$udid" log show --last 3m --style compact --predicate 'eventMessage CONTAINS "Legion" OR eventMessage CONTAINS "com.x1f4r.legion"' | tail -n 100 || true
              xcrun simctl shutdown "$udid" || true
              exit 1
            fi

            # Confirm the app data directory is excluded from iCloud/iTunes backups.
            local app_data_dir="$data_dir/Library/Application Support/com.x1f4r.legion"
            test -d "$app_data_dir"
            swift - "$app_data_dir" << 'SWIFT'
          import Foundation
          let path = CommandLine.arguments[1]
          let url = URL(fileURLWithPath: path)
          let values = try url.resourceValues(forKeys: [.isExcludedFromBackupKey])
          guard values.isExcludedFromBackup == true else {
              fputs("Expected isExcludedFromBackup == true for \(path), got \(String(describing: values.isExcludedFromBackup))\n", stderr)
              exit(1)
          }
          print("Verified isExcludedFromBackup == true for \(path)")
          SWIFT

            sleep 2
            xcrun simctl io "$udid" screenshot "ci-shots/ios/${kind}-dark.png"

            xcrun simctl ui "$udid" appearance light
            sleep 2
            xcrun simctl io "$udid" screenshot "ci-shots/ios/${kind}-light.png"

            xcrun simctl terminate "$udid" com.x1f4r.legion || true
            xcrun simctl shutdown "$udid" || true
          }

          run_simulator iphone "$IPHONE_UDID" "$IPHONE_NAME"
          run_simulator ipad "$IPAD_UDID" "$IPAD_NAME"
          ls -lh ci-shots/ios/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-ios-screenshots
          path: ci-shots/ios/*.png
          if-no-files-found: error
      - name: Build unsigned iOS device IPA
        working-directory: apps/legion-app
        run: |
          set -euo pipefail
          cargo tauri ios build --target aarch64 --no-sign --ci
          IPA_PATH="$(find src-tauri/gen/apple/build -maxdepth 4 -name '*.ipa' | head -n 1)"
          test -s "$IPA_PATH"
          mkdir -p ../../ci-artifacts
          cp "$IPA_PATH" ../../ci-artifacts/Legion-ios-unsigned.ipa
          ls -lh ../../ci-artifacts/Legion-ios-unsigned.ipa
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-ios-unsigned-ipa
          path: ci-artifacts/Legion-ios-unsigned.ipa
          if-no-files-found: error

  macos-desktop:
    name: macOS desktop bundle
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'macos-desktop'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: legion-app-tauri-cli-${{ runner.os }}-2.12.6-${{ hashFiles('rust-toolchain.toml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/legion-app/src-tauri/target/
          key: legion-app-macos-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'apps/legion-app/src-tauri/Cargo.lock') }}
          restore-keys: legion-app-macos-${{ runner.os }}-
      - name: Install tauri-cli 2.12.6
        run: |
          set -euo pipefail
          if [ "$(cargo tauri --version 2>/dev/null || true)" != "tauri-cli 2.12.6" ]; then
            cargo install tauri-cli --version =2.12.6 --locked
          fi
      - name: Run unit tests on macOS (including Apple backup exclusion)
        run: cargo test --manifest-path apps/legion-app/src-tauri/Cargo.toml --locked
      - name: Build Apple Silicon app and dmg (ad-hoc signed)
        working-directory: apps/legion-app
        run: |
          set -euo pipefail
          cargo tauri build --bundles app,dmg
          ls -lh src-tauri/target/release/bundle/macos/ src-tauri/target/release/bundle/dmg/
      - name: Launch macOS app, verify window and ready marker
        run: |
          set -euo pipefail
          APP_PATH="$(find apps/legion-app/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)"
          test -d "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH" || codesign --force --deep --sign - "$APP_PATH"
          EXEC_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          EXEC_PATH="$APP_PATH/Contents/MacOS/$EXEC_NAME"
          test -x "$EXEC_PATH"

          READY_FILE="$RUNNER_TEMP/legion-macos-ready.txt"
          rm -f "$READY_FILE"
          mkdir -p ci-shots/macos

          LEGION_APP_READY_FILE="$READY_FILE" "$EXEC_PATH" >"$RUNNER_TEMP/legion-macos.log" 2>&1 &
          APP_PID=$!

          FOUND=0
          for i in $(seq 1 60); do
            if [ -f "$READY_FILE" ] && grep -q "legion-app: interface ready" "$READY_FILE"; then
              echo "macOS desktop ready after ${i}s: $(cat "$READY_FILE")"
              FOUND=1
              break
            fi
            sleep 1
          done

          swift - "$APP_PID" << 'SWIFT' || true
          import CoreGraphics
          import Foundation
          let pid = Int32(CommandLine.arguments[1]) ?? -1
          let windows = (CGWindowListCopyWindowInfo([.optionAll], kCGNullWindowID) as? [[String: Any]]) ?? []
          let mine = windows.filter { ($0[kCGWindowOwnerPID as String] as? Int32) == pid }
          print("macOS windows for PID \(pid): \(mine.count)")
          for w in mine {
              print("  name=\(w[kCGWindowName as String] ?? "") bounds=\(w[kCGWindowBounds as String] ?? "")")
          }
          SWIFT

          screencapture -x ci-shots/macos/macos-desktop.png || true
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true
          cat "$RUNNER_TEMP/legion-macos.log" || true
          [ "$FOUND" -eq 1 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-macos-dmg
          path: apps/legion-app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-macos-screenshots
          path: ci-shots/macos/*.png
          if-no-files-found: ignore

  windows-desktop:
    name: Windows desktop installer
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'windows-desktop'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: legion-app-tauri-cli-${{ runner.os }}-2.12.6-${{ hashFiles('rust-toolchain.toml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/legion-app/src-tauri/target/
          key: legion-app-windows-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'apps/legion-app/src-tauri/Cargo.lock') }}
          restore-keys: legion-app-windows-${{ runner.os }}-
      - name: Install tauri-cli 2.12.6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (& cargo tauri --version 2>$null)
          if ($ver -ne 'tauri-cli 2.12.6') {
            cargo install tauri-cli --version =2.12.6 --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build NSIS installer
        working-directory: apps/legion-app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem src-tauri\target\release\bundle\nsis\
      - name: Silently install NSIS package, launch app and verify ready marker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = Get-ChildItem -Path 'apps\legion-app\src-tauri\target\release\bundle\nsis' -Filter '*.exe' | Select-Object -First 1
          if (-not $nsis) { throw 'NSIS installer not found.' }
          Write-Host "Installing $($nsis.FullName) silently..."

          $installDir = Join-Path $env:RUNNER_TEMP 'legion-install'
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          $instProc = Start-Process -FilePath $nsis.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($instProc.ExitCode -ne 0) { throw "NSIS silent install exited with $($instProc.ExitCode)" }

          $exe = Get-ChildItem -Path $installDir -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) {
            Write-Host "Installed files:"
            Get-ChildItem -Path $installDir -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw 'Installed Legion executable not found.'
          }
          Write-Host "Launching installed executable: $($exe.FullName)"

          $readyFile = Join-Path $env:RUNNER_TEMP 'legion-windows-ready.txt'
          Remove-Item -LiteralPath $readyFile -Force -ErrorAction SilentlyContinue
          $env:LEGION_APP_READY_FILE = $readyFile

          $appProc = Start-Process -FilePath $exe.FullName -PassThru
          $found = $false
          for ($i = 1; $i -le 60; $i++) {
            if ((Test-Path -LiteralPath $readyFile) -and ((Get-Content -LiteralPath $readyFile -Raw) -match 'legion-app: interface ready')) {
              Write-Host "Windows desktop ready after ${i}s: $((Get-Content -LiteralPath $readyFile -Raw).Trim())"
              $found = $true
              break
            }
            if ($appProc.HasExited) {
              throw "Legion Windows process exited early with code $($appProc.ExitCode)"
            }
            Start-Sleep -Seconds 1
          }

          $appProc.Refresh()
          Write-Host "MainWindowTitle='$($appProc.MainWindowTitle)' MainWindowHandle=$($appProc.MainWindowHandle)"

          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $gfx = [System.Drawing.Graphics]::FromImage($bmp)
            $gfx.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            New-Item -ItemType Directory -Path 'ci-shots\windows' -Force | Out-Null
            $bmp.Save('ci-shots\windows\windows-desktop.png', [System.Drawing.Imaging.ImageFormat]::Png)
            $gfx.Dispose()
            $bmp.Dispose()
          } catch {
            Write-Host "Screenshot capture skipped: $_"
          }

          if (-not $appProc.HasExited) {
            Stop-Process -Id $appProc.Id -Force -ErrorAction SilentlyContinue
          }
          if (-not $found) {
            throw "Timed out waiting for Windows ready marker at $readyFile"
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-windows-nsis
          path: apps/legion-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-windows-screenshots
          path: ci-shots/windows/*.png
          if-no-files-found: ignore
