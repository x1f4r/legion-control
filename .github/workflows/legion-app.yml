name: Legion App
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'crates/**'
      - '.github/workflows/legion-app.yml'
      - 'scripts/build-linux-app-bundles.sh'
      - 'scripts/ios-sim-resume.sh'
      - 'scripts/legion-app-distro-test.sh'
      - 'rust-toolchain.toml'
  pull_request:
    paths:
      - 'apps/**'
      - 'crates/**'
      - '.github/workflows/legion-app.yml'
      - 'scripts/build-linux-app-bundles.sh'
      - 'scripts/ios-sim-resume.sh'
      - 'scripts/legion-app-distro-test.sh'
      - 'rust-toolchain.toml'
  workflow_dispatch:
    inputs:
      job:
        description: 'Run all jobs or a single platform job'
        type: choice
        default: all
        options:
          - all
          - rust-check
          - android
          - linux-desktop
          - ios
          - macos-desktop
          - windows-desktop
permissions:
  contents: read
# A newer push to a pull request or feature branch supersedes the run still going on it; every push
# to main runs to completion in its own concurrency group.
concurrency:
  group: legion-app-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}
# Every action is pinned to the commit of the release named beside it, matching checks.yml.
jobs:
  rust-check:
    name: Rust check (Linux)
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'rust-check'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install
      - name: Install Linux WebKitGTK and GTK build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            build-essential
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/legion-app/src-tauri/target/
          key: legion-app-check-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'apps/legion-app/src-tauri/Cargo.lock') }}
          restore-keys: legion-app-check-${{ runner.os }}-
      - name: Format, clippy and unit tests
        run: |
          cargo fmt --manifest-path apps/legion-app/src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path apps/legion-app/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path apps/legion-app/src-tauri/Cargo.toml --locked

  android:
    name: Android debug APK and emulator
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            apps/legion-app/src-tauri/gen/android/*.gradle*
            apps/legion-app/src-tauri/gen/android/app/*.gradle*
            apps/legion-app/src-tauri/gen/android/buildSrc/**/*.gradle*
            apps/legion-app/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install Android platform, build-tools and NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Install Rust and Android targets
        run: |
          rustup toolchain install
          rustup target add \
            aarch64-linux-android \
            x86_64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: legion-app-tauri-cli-${{ runner.os }}-2.12.6-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: legion-app-tauri-cli-${{ runner.os }}-2.12.6-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/legion-app/src-tauri/target/
          key: legion-app-android-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'apps/legion-app/src-tauri/Cargo.lock') }}
          restore-keys: legion-app-android-${{ runner.os }}-
      - name: Install tauri-cli 2.12.6
        run: |
          set -euo pipefail
          if [ "$(cargo tauri --version 2>/dev/null || true)" != "tauri-cli 2.12.6" ]; then
            cargo install tauri-cli --version =2.12.6 --locked
          fi
      - id: build
        name: Build Android debug APK (arm64 + x86_64)
        working-directory: apps/legion-app
        run: |
          set -euo pipefail
          rm -rf src-tauri/gen/android/app/build/outputs/apk
          export LEGION_BUILD_SEQUENCE="$(date -u +%Y%m%d%H%M)"
          cargo tauri android build --debug --apk --target aarch64 --target x86_64 2>&1 | tee "$RUNNER_TEMP/android-build.log"
          APK_REL="apps/legion-app/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          test -f "../../$APK_REL"
          node ../../scripts/make-update-set.mjs check-artifact \
            --file "../../$APK_REL" \
            --kind apk \
            --sequence "$LEGION_BUILD_SEQUENCE" \
            --forbid-preview-key \
            --build-log "$RUNNER_TEMP/android-build.log"
          echo "apk_path=$APK_REL" >> "$GITHUB_OUTPUT"
      - name: Run Android Kotlin unit tests
        working-directory: apps/legion-app/src-tauri/gen/android
        run: ./gradlew :app:testUniversalDebugUnitTest
      - name: Build local legion node binary for emulator content-media check
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/android-node-target" cargo build --locked --bin legion
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write Android emulator verification script
        run: |
          cat << 'EOF' > "$RUNNER_TEMP/verify-android.sh"
          #!/usr/bin/env bash
          set -euo pipefail
          APK="apps/legion-app/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          LEGION_BIN="$RUNNER_TEMP/android-node-target/debug/legion"
          MEDIA_WORK="$RUNNER_TEMP/android-media"
          rm -rf "$MEDIA_WORK"
          cleanup() {
            if [ -f "$MEDIA_WORK/sshd.pid" ]; then
              kill "$(cat "$MEDIA_WORK/sshd.pid")" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          node scripts/ci-media-fixture.mjs ssh --work "$MEDIA_WORK" --legion "$LEGION_BIN" --host 10.0.2.2 --no-out-file >/dev/null
          mkdir -p ci-shots/android
          adb install -r "$APK"
          adb shell "run-as com.x1f4r.legion.debug tee media-check.json >/dev/null" < "$MEDIA_WORK/media-check.json"
          adb logcat -c
          adb shell cmd uimode night yes
          adb shell am start -W -n com.x1f4r.legion.debug/com.x1f4r.legion.MainActivity
          FOUND=0
          MEDIA_OK=0
          for i in $(seq 1 90); do
            APP_LOG="$(adb logcat -d -s legion-app:I)"
            if [ "$FOUND" -eq 0 ] && grep -q "legion-app: interface ready" <<<"$APP_LOG"; then
              echo "Android interface ready after ${i}s"
              grep "legion-app: interface ready" <<<"$APP_LOG"
              FOUND=1
            fi
            if [ "$MEDIA_OK" -eq 0 ] && grep -q "legion-app: media check ok" <<<"$APP_LOG"; then
              echo "Android content media check passed after ${i}s"
              grep "legion-app: media check ok" <<<"$APP_LOG"
              MEDIA_OK=1
            fi
            if adb logcat -d -s legion-app:E | grep -q "legion-app: media check failed"; then
              echo "Android content media check failed:"
              adb logcat -d -s legion-app:E | grep "legion-app: media check failed"
              cat "$MEDIA_WORK/sshd.log" || true
              exit 1
            fi
            if [ "$FOUND" -eq 1 ] && [ "$MEDIA_OK" -eq 1 ]; then
              break
            fi
            sleep 1
          done
          if [ "$FOUND" -ne 1 ] || [ "$MEDIA_OK" -ne 1 ]; then
            echo "Timed out waiting for Android ready ($FOUND) and media check ($MEDIA_OK). Recent logcat:"
            adb logcat -d -t 150
            cat "$MEDIA_WORK/sshd.log" || true
            adb exec-out screencap -p > ci-shots/android/android-timeout.png || true
            exit 1
          fi
          sleep 2
          adb exec-out screencap -p > ci-shots/android/android-dark.png
          adb shell cmd uimode night no
          sleep 2
          adb exec-out screencap -p > ci-shots/android/android-light.png
          ls -lh ci-shots/android/
          EOF
          chmod +x "$RUNNER_TEMP/verify-android.sh"
      - name: Boot Android emulator, verify ready marker and capture screenshots
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$RUNNER_TEMP/verify-android.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-android-debug-apk
          path: ${{ steps.build.outputs.apk_path }}
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-android-screenshots
          path: ci-shots/android/*.png
          if-no-files-found: error

  linux-desktop:
    name: Linux desktop bundles
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'linux-desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install
      - name: Install Linux Tauri bundle and headless display dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            file \
            curl \
            build-essential \
            xvfb \
            dbus-x11 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cache/legion-app-u22/tauri-cli
          key: legion-app-tauri-cli-${{ runner.os }}-2.12.6-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: legion-app-tauri-cli-${{ runner.os }}-2.12.6-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/legion-app/src-tauri/target/
          key: legion-app-linux-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'apps/legion-app/src-tauri/Cargo.lock') }}
          restore-keys: legion-app-linux-${{ runner.os }}-
      - name: Install tauri-cli 2.12.6
        run: |
          set -euo pipefail
          if [ "$(cargo tauri --version 2>/dev/null || true)" != "tauri-cli 2.12.6" ]; then
            cargo install tauri-cli --version =2.12.6 --locked
          fi
      - id: build
        name: Build deb and AppImage bundles (ubuntu:22.04 glibc baseline)
        working-directory: apps/legion-app
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        # The cached target directory can hold bundles from an earlier run under another name.
        # Building inside ubuntu:22.04 pins the glibc floor to 2.35 so the shipped .deb and
        # AppImage run on Debian 12 and Ubuntu 22.04 as well as newer releases.
        run: |
          set -euo pipefail
          rm -rf src-tauri/target/release/bundle
          export LEGION_BUILD_SEQUENCE="$(date -u +%Y%m%d%H%M)"
          export LEGION_BUILD_REV="${{ github.sha }}"
          bash ../../scripts/build-linux-app-bundles.sh \
            --sequence "$LEGION_BUILD_SEQUENCE" \
            --build-log "$RUNNER_TEMP/linux-build.log"
          mapfile -t DEBS < <(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | sort)
          mapfile -t IMAGES < <(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | sort)
          test "${#DEBS[@]}" -eq 1
          test "${#IMAGES[@]}" -eq 1
          DEB_FILE="${DEBS[0]}"
          IMG_FILE="${IMAGES[0]}"
          node ../../scripts/check-binary-paths.mjs src-tauri/target/release/legion-app
          node ../../scripts/make-update-set.mjs check-artifact \
            --file src-tauri/target/release/legion-app \
            --kind binary \
            --sequence "$LEGION_BUILD_SEQUENCE" \
            --forbid-preview-key \
            --build-log "$RUNNER_TEMP/linux-build.log"
          node ../../scripts/make-update-set.mjs check-artifact \
            --file "$DEB_FILE" \
            --kind deb \
            --sequence "$LEGION_BUILD_SEQUENCE" \
            --forbid-preview-key \
            --build-log "$RUNNER_TEMP/linux-build.log"
          node ../../scripts/make-update-set.mjs check-artifact \
            --file "$IMG_FILE" \
            --kind appimage \
            --sequence "$LEGION_BUILD_SEQUENCE" \
            --forbid-preview-key \
            --build-log "$RUNNER_TEMP/linux-build.log"
          echo "deb_path=apps/legion-app/${DEB_FILE#./}" >> "$GITHUB_OUTPUT"
          echo "appimage_path=apps/legion-app/${IMG_FILE#./}" >> "$GITHUB_OUTPUT"
      - name: Verify deb and AppImage across Debian and Ubuntu containers
        run: |
          set -euo pipefail
          DEB="${{ steps.build.outputs.deb_path }}"
          IMG="${{ steps.build.outputs.appimage_path }}"
          for distro in debian:12 debian:13 ubuntu:22.04 ubuntu:24.04 ubuntu:26.04; do
            bash scripts/legion-app-distro-test.sh "$distro" "$DEB" "$IMG"
          done
      - name: Verify deb package metadata does not collide with node package
        run: |
          set -euo pipefail
          DEB="${{ steps.build.outputs.deb_path }}"
          test -f "$DEB"
          PKG="$(dpkg-deb -f "$DEB" Package)"
          echo "Desktop app .deb package name: $PKG"
          test "$PKG" = "legion-app"
          ! dpkg-deb -f "$DEB" Description | grep -qx ' (none)'
          UNPACKED="$RUNNER_TEMP/legion-app-deb"
          rm -rf "$UNPACKED"
          dpkg-deb -x "$DEB" "$UNPACKED"
          grep -qx 'Name=Legion' "$UNPACKED/usr/share/applications/legion-app.desktop"
      - name: Launch Linux release and debug apps under Xvfb, verify ready marker and content media decoding
        run: |
          set -euo pipefail
          MEDIA_WORK="$RUNNER_TEMP/linux-media"
          rm -rf "$MEDIA_WORK"
          mkdir -p "$MEDIA_WORK/bin"
          CARGO_TARGET_DIR="$RUNNER_TEMP/linux-node-target" cargo build --locked --bin legion
          cp "$RUNNER_TEMP/linux-node-target/debug/legion" "$MEDIA_WORK/bin/legion"
          chmod 755 "$MEDIA_WORK/bin/legion"
          node scripts/ci-media-fixture.mjs local \
            --work "$MEDIA_WORK" \
            --legion "$MEDIA_WORK/bin/legion" \
            --out "$MEDIA_WORK/result.json" >/dev/null

          # 1) Release binary: verify zero debug switches/hooks are embedded, then paint ready via
          # the fixed stdout log line and prove LEGION_APP_READY_FILE and LEGION_APP_MEDIA_CHECK_FILE
          # are both ignored.
          node scripts/check-binary-paths.mjs \
            apps/legion-app/src-tauri/target/release/legion-app \
            --no-defaults \
            --forbid LEGION_APP_READY_FILE \
            --forbid LEGION_APP_MEDIA_CHECK_FILE \
            --forbid LEGION_APP_TEST_QUIT_CONFIRM \
            --forbid LEGION_APP_ALLOW_LOOPBACK_ENDPOINTS \
            --forbid LEGION_CONTENT_LOG \
            --forbid transfer_upload_test_files \
            --forbid allow-loopback-endpoints \
            --forbid legion-content:

          READY_FILE="$RUNNER_TEMP/legion-linux-ready.txt"
          REL_LOG="$RUNNER_TEMP/legion-linux-release.log"
          rm -f "$READY_FILE" "$REL_LOG" "$MEDIA_WORK/result.json"
          REL_PID=""
          APP_PID=""
          cleanup_smoke() {
            for pid in "$REL_PID" "$APP_PID"; do
              if [ -n "$pid" ]; then
                kill -TERM -- "-$pid" 2>/dev/null || kill "$pid" 2>/dev/null || true
                sleep 1
                kill -KILL -- "-$pid" 2>/dev/null || kill -9 "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
              fi
            done
          }
          trap cleanup_smoke EXIT
          PATH="$MEDIA_WORK/bin:$PATH" \
          LEGION_HOME="$MEDIA_WORK/node" \
          LEGION_APP_READY_FILE="$READY_FILE" \
          LEGION_APP_MEDIA_CHECK_FILE="$MEDIA_WORK/media-check.json" \
          LEGION_CONTENT_LOG=1 \
          WEBKIT_DISABLE_DMABUF_RENDERER=1 \
          WEBKIT_DISABLE_COMPOSITING_MODE=1 \
          setsid dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" \
            apps/legion-app/src-tauri/target/release/legion-app \
            >"$REL_LOG" 2>&1 &
          REL_PID=$!
          REL_READY=0
          for i in $(seq 1 45); do
            if [ -f "$REL_LOG" ] && grep -q "legion-app: interface ready" "$REL_LOG"; then
              echo "Linux desktop release ready (stdout) after ${i}s"
              REL_READY=1
              sleep 2
              break
            fi
            sleep 1
          done
          cleanup_smoke
          REL_PID=""
          cat "$REL_LOG" || true
          [ "$REL_READY" -eq 1 ]
          if [ -e "$READY_FILE" ]; then
            echo "ERROR: Release build unexpectedly honored LEGION_APP_READY_FILE"
            exit 1
          fi
          if [ -f "$MEDIA_WORK/result.json" ]; then
            echo "ERROR: Release build unexpectedly honored LEGION_APP_MEDIA_CHECK_FILE"
            exit 1
          fi

          # 2) Debug binary: verify content media decoding + HTML/SVG IPC isolation.
          cargo build --manifest-path apps/legion-app/src-tauri/Cargo.toml --locked
          rm -f "$READY_FILE" "$MEDIA_WORK/result.json"
          PATH="$MEDIA_WORK/bin:$PATH" \
          LEGION_HOME="$MEDIA_WORK/node" \
          LEGION_APP_READY_FILE="$READY_FILE" \
          LEGION_APP_MEDIA_CHECK_FILE="$MEDIA_WORK/media-check.json" \
          WEBKIT_DISABLE_DMABUF_RENDERER=1 \
          WEBKIT_DISABLE_COMPOSITING_MODE=1 \
          setsid dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" \
            apps/legion-app/src-tauri/target/debug/legion-app \
            >"$RUNNER_TEMP/legion-linux.log" 2>&1 &
          APP_PID=$!
          FOUND=0
          MEDIA_OK=0
          for i in $(seq 1 60); do
            if [ "$FOUND" -eq 0 ] && [ -f "$READY_FILE" ] && grep -q "legion-app: interface ready" "$READY_FILE"; then
              echo "Linux desktop debug ready after ${i}s: $(cat "$READY_FILE")"
              FOUND=1
            fi
            if [ "$MEDIA_OK" -eq 0 ] && [ -f "$MEDIA_WORK/result.json" ]; then
              cat "$MEDIA_WORK/result.json"
              node -e 'const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (!r.ok || r.image_width <= 0 || r.video_width <= 0 || r.ipc_isolation_ok !== true) process.exit(1);' "$MEDIA_WORK/result.json"
              MEDIA_OK=1
            fi
            if [ "$FOUND" -eq 1 ] && [ "$MEDIA_OK" -eq 1 ]; then
              break
            fi
            sleep 1
          done
          cleanup_smoke
          APP_PID=""
          cat "$RUNNER_TEMP/legion-linux.log" || true
          [ "$FOUND" -eq 1 ] && [ "$MEDIA_OK" -eq 1 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-linux-bundles
          path: |
            ${{ steps.build.outputs.deb_path }}
            ${{ steps.build.outputs.appimage_path }}
          if-no-files-found: error
      - name: Verify Linux AppImage self-update from local node (preview key)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          WORK="$HOME/.cache/legion-ci-update-test"
          DIAG="$PWD/ci-diag/linux-self-update"
          APP_DATA="${XDG_DATA_HOME:-$HOME/.local/share}/com.x1f4r.legion/updates"
          rm -rf "$WORK" "$DIAG" "$APP_DATA"
          mkdir -p "$WORK/bin" "$WORK/run" "$WORK/node" "$DIAG"
          chmod 700 "$WORK"

          dump_diag() {
            local rc=$?
            set +e
            local fail_reason=""
            [ -f "$DIAG/fail-reason.txt" ] && fail_reason="$(cat "$DIAG/fail-reason.txt" 2>/dev/null || true)"
            {
              echo "=== Linux self-update diagnostics (exit=$rc, reason=${fail_reason:-none}) ==="
              echo "--- ps aux ---"
              ps aux
              echo "--- $APP_DATA tree ---"
              find "$APP_DATA" -maxdepth 4 -ls 2>/dev/null || true
              echo "--- $WORK/run tree ---"
              ls -la "$WORK/run" 2>/dev/null || true
            } > "$DIAG/summary.txt"
            pkill -f "$WORK/run/Legion.AppImage" 2>/dev/null || true
            rm -rf apps/legion-app/src-tauri/target/release/bundle
            for f in prefs.json floor.json current-build.json last-state.json supervisor.log supervisor-script.sh.txt new-start.log rollback-ps.txt update.lock; do
              [ -f "$APP_DATA/$f" ] && cp "$APP_DATA/$f" "$DIAG/$f"
            done
            for f in "$APP_DATA"/rollback-*.json "$APP_DATA"/deferred-*.json "$APP_DATA"/started-*.ok; do
              [ -f "$f" ] && cp "$f" "$DIAG/$(basename "$f")"
            done
            if [ "$rc" -ne 0 ]; then
              if [ -z "$fail_reason" ]; then
                echo "FAIL (Linux self-update): step failed with exit code $rc before inner verifier reported a reason" >&2
              fi
              for f in "$DIAG"/*; do
                [ -f "$f" ] || continue
                echo "===== DIAG $(basename "$f") ====="
                cat "$f" || true
              done
            fi
            exit "$rc"
          }
          trap dump_diag EXIT

          node scripts/make-update-set.mjs keygen \
            --key "$WORK/preview.key" \
            --public-key "$WORK/preview.pub.pem"

          LEGION_PREVIEW_UPDATE_KEY="$WORK/preview.pub.pem" \
          CARGO_TARGET_DIR="$WORK/node-target" \
            cargo build --release --locked --bin legion
          cp "$WORK/node-target/release/legion" "$WORK/bin/legion"
          chmod 755 "$WORK/bin/legion"

          SEQ1="$(node -e 'import("./scripts/make-update-set.mjs").then(m => console.log(m.currentSequence(new Date(Date.now() - 10 * 60_000))))')"
          SEQ2="$(node scripts/make-update-set.mjs sequence)"
          if [ "$SEQ2" -le "$SEQ1" ]; then SEQ2="$((SEQ1 + 1))"; fi

          rm -rf apps/legion-app/src-tauri/target/release/bundle
          CFG1="$(node scripts/make-update-set.mjs tauri-config --os linux --version 0.1.0 --sequence "$SEQ1")"
          (
            cd apps/legion-app
            LEGION_PREVIEW_UPDATE_KEY="$WORK/preview.pub.pem" \
            LEGION_BUILD_SEQUENCE="$SEQ1" \
            LEGION_BUILD_REV="seq-$SEQ1" \
              cargo tauri build --bundles appimage --config "$CFG1"
          )
          IMG1="$(find apps/legion-app/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n 1)"
          test -f "$IMG1"
          cp "$IMG1" "$WORK/Legion-seq1.AppImage"
          cp "$IMG1" "$WORK/run/Legion.AppImage"
          chmod 755 "$WORK/Legion-seq1.AppImage" "$WORK/run/Legion.AppImage"

          rm -rf apps/legion-app/src-tauri/target/release/bundle
          CFG2="$(node scripts/make-update-set.mjs tauri-config --os linux --version 0.1.1 --sequence "$SEQ2")"
          (
            cd apps/legion-app
            LEGION_PREVIEW_UPDATE_KEY="$WORK/preview.pub.pem" \
            LEGION_BUILD_SEQUENCE="$SEQ2" \
            LEGION_BUILD_REV="seq-$SEQ2" \
              cargo tauri build --bundles appimage --config "$CFG2"
          )
          IMG2="$(find apps/legion-app/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n 1)"
          test -f "$IMG2"
          cp "$IMG2" "$WORK/Legion-linux-x86_64.AppImage"
          chmod 755 "$WORK/Legion-linux-x86_64.AppImage"

          node scripts/make-update-set.mjs create \
            --out "$WORK/set-2" \
            --channel preview \
            --version 0.1.1 \
            --build "seq-$SEQ2" \
            --sequence "$SEQ2" \
            --notes "CI Linux AppImage self-update verification." \
            --key "$WORK/preview.key" \
            --artifact "$WORK/Legion-linux-x86_64.AppImage:program=app,os=linux,arch=x86_64,kind=appimage,name=Legion-linux-x86_64.AppImage"

          LEGION_HOME="$WORK/node" "$WORK/bin/legion" init --name tower >/dev/null
          LEGION_HOME="$WORK/node" "$WORK/bin/legion" update.publish "from=$WORK/set-2" --json
          LEGION_HOME="$WORK/node" "$WORK/bin/legion" update.list --json > "$DIAG/node-update-list.json"

          # Run both launches inside one dbus-run-session + xvfb-run so Xvfb gets a free display
          # and valid XAUTHORITY and stays alive across seq1 exit and seq2 relaunch.
          cat << 'INNER' > "$WORK/run-appimage-test.sh"
          #!/usr/bin/env bash
          set -euo pipefail
          PID1=""
          PID2=""
          fail() {
            local msg="$*"
            printf '%s\n' "$msg" > "$DIAG/fail-reason.txt"
            ps -Aww -o pid=,ppid=,stat=,comm=,args= > "$DIAG/fail-ps.txt" 2>/dev/null || true
            echo "FAIL (Linux self-update): $msg" >&2
            exit 1
          }
          count_app_instances() {
            local target_real count=0 p comm state
            target_real="$(readlink -f "$WORK/run/Legion.AppImage" 2>/dev/null || printf '%s' "$WORK/run/Legion.AppImage")"
            for p in /proc/[0-9]*; do
              [ -r "$p/comm" ] && [ -r "$p/stat" ] && [ -r "$p/environ" ] || continue
              comm="$(cat "$p/comm" 2>/dev/null || true)"
              [ "$comm" = "legion-app" ] || continue
              state="$(awk '{ sub(/^[^)]*\) /, ""); print $1 }' "$p/stat" 2>/dev/null || true)"
              [ "$state" = "Z" ] && continue
              if tr '\0' '\n' < "$p/environ" 2>/dev/null | grep -Fqx "APPIMAGE=$target_real"; then
                count=$((count + 1))
              fi
            done
            echo "$count"
          }
          stop_app_instances() {
            local target_real sig p pid comm state
            target_real="$(readlink -f "$WORK/run/Legion.AppImage" 2>/dev/null || printf '%s' "$WORK/run/Legion.AppImage")"
            for sig in TERM KILL; do
              for p in /proc/[0-9]*; do
                pid="${p#/proc/}"
                [ -r "$p/comm" ] && [ -r "$p/stat" ] && [ -r "$p/environ" ] || continue
                comm="$(cat "$p/comm" 2>/dev/null || true)"
                [ "$comm" = "legion-app" ] || continue
                state="$(awk '{ sub(/^[^)]*\) /, ""); print $1 }' "$p/stat" 2>/dev/null || true)"
                [ "$state" = "Z" ] && continue
                if tr '\0' '\n' < "$p/environ" 2>/dev/null | grep -Fqx "APPIMAGE=$target_real"; then
                  kill "-$sig" "$pid" 2>/dev/null || true
                fi
              done
              pkill "-$sig" -f "$WORK/run/Legion.AppImage" 2>/dev/null || true
              for _ in $(seq 1 20); do
                if [ "$(count_app_instances)" -eq 0 ]; then
                  return 0
                fi
                sleep 0.25
              done
            done
          }
          kill_pg() {
            local pg="$1"
            [ -n "$pg" ] || return 0
            kill -TERM -- "-$pg" 2>/dev/null || kill "$pg" 2>/dev/null || true
            for _ in $(seq 1 20); do
              if ! kill -0 -- "-$pg" 2>/dev/null; then
                break
              fi
              sleep 0.25
            done
            kill -KILL -- "-$pg" 2>/dev/null || kill -9 "$pg" 2>/dev/null || true
            wait "$pg" 2>/dev/null || true
          }
          wait_dbus_free() {
            if ! command -v dbus-send >/dev/null 2>&1 || [ -z "${DBUS_SESSION_BUS_ADDRESS:-}" ]; then
              return 0
            fi
            for _ in $(seq 1 40); do
              local reply
              reply="$(dbus-send --session --dest=org.freedesktop.DBus --type=method_call --print-reply \
                /org/freedesktop/DBus org.freedesktop.DBus.NameHasOwner string:com.x1f4r.legion.SingleInstance 2>/dev/null || true)"
              case "$reply" in
                *"boolean true"*) sleep 0.25 ;;
                *) return 0 ;;
              esac
            done
          }
          wait_for_download() {
            local phase="$1" timeout="$2" downloaded=0 i has_cur=0 has_dl=0 has_part=0 has_prefs=0
            for i in $(seq 1 "$timeout"); do
              if [ $((i % 10)) -eq 0 ]; then
                {
                  echo "=== ${phase} run1 t=${i}s ==="
                  cat "$APP_DATA/last-state.json" 2>/dev/null || echo "(no last-state.json)"
                } >> "$DIAG/poll-trace.log"
              fi
              if [ -f "$APP_DATA/current-build.json" ] && grep -q "\"sequence\": $SEQ1" "$APP_DATA/current-build.json" \
                 && [ -f "$DL_FILE" ] && [ ! -f "$DL_FILE.part" ] \
                 && [ -f "$APP_DATA/prefs.json" ] && grep -q "\"sequence\": $SEQ2" "$APP_DATA/prefs.json"; then
                downloaded=1
                break
              fi
              sleep 1
            done
            kill_pg "$PID1"
            PID1=""
            stop_app_instances
            wait_dbus_free
            if [ "$downloaded" -ne 1 ]; then
              [ -f "$APP_DATA/current-build.json" ] && grep -q "\"sequence\": $SEQ1" "$APP_DATA/current-build.json" && has_cur=1
              [ -f "$DL_FILE" ] && has_dl=1
              [ -f "$DL_FILE.part" ] && has_part=1
              [ -f "$APP_DATA/prefs.json" ] && grep -q "\"sequence\": $SEQ2" "$APP_DATA/prefs.json" && has_prefs=1
              fail "$phase download did not complete within ${timeout}s (current_seq1=$has_cur dl_file=$has_dl dl_part=$has_part prefs_seq2=$has_prefs)"
            fi
          }
          verify_updated() {
            local phase="$1" timeout="$2" updated=0 i
            local has_marker=0 has_cur2=0 backup_gone=0 lock_gone=0 instances=0 rollback_files=""
            for i in $(seq 1 "$timeout"); do
              if [ $((i % 10)) -eq 0 ]; then
                {
                  echo "=== ${phase} run2 t=${i}s ==="
                  cat "$APP_DATA/last-state.json" 2>/dev/null || echo "(no last-state.json)"
                  cat "$APP_DATA/supervisor.log" 2>/dev/null || echo "(no supervisor.log)"
                  [ -f "$APP_DATA/new-start.log" ] && cat "$APP_DATA/new-start.log" || true
                } >> "$DIAG/poll-trace.log"
              fi
              if [ -f "$APP_DATA/started-$SEQ2.ok" ] \
                 && [ -f "$APP_DATA/current-build.json" ] \
                 && grep -q "\"sequence\": $SEQ2" "$APP_DATA/current-build.json" \
                 && [ ! -e "$WORK/run/.Legion.AppImage.prev" ] \
                 && [ ! -e "$APP_DATA/update.lock" ]; then
                updated=1
                break
              fi
              sleep 1
            done
            if [ "$updated" -ne 1 ]; then
              [ -f "$APP_DATA/started-$SEQ2.ok" ] && has_marker=1
              [ -f "$APP_DATA/current-build.json" ] && grep -q "\"sequence\": $SEQ2" "$APP_DATA/current-build.json" && has_cur2=1
              [ ! -e "$WORK/run/.Legion.AppImage.prev" ] && backup_gone=1
              [ ! -e "$APP_DATA/update.lock" ] && lock_gone=1
              instances="$(count_app_instances)"
              fail "$phase update did not complete within ${timeout}s (started_marker=$has_marker current_seq2=$has_cur2 backup_gone=$backup_gone lock_gone=$lock_gone running_instances=$instances)"
            fi
            instances="$(count_app_instances)"
            if [ "$instances" -ne 1 ]; then
              for _ in $(seq 1 10); do
                sleep 0.5
                instances="$(count_app_instances)"
                if [ "$instances" -eq 1 ]; then break; fi
              done
            fi
            [ "$instances" -eq 1 ] || fail "$phase expected exactly 1 running legion-app instance after update, found $instances"
            [ ! -e "$WORK/run/.Legion.AppImage.prev" ] || fail "$phase backup AppImage still present after update"
            [ ! -e "$APP_DATA/update.lock" ] || fail "$phase update.lock still present after update"
            rollback_files="$(find "$APP_DATA" -maxdepth 1 -name 'rollback-*.json' -print 2>/dev/null | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
            [ -z "$rollback_files" ] || fail "$phase produced unexpected rollback file(s): $rollback_files"
            cat "$APP_DATA/current-build.json" || true
            kill_pg "$PID2"
            PID2=""
            stop_app_instances
            wait_dbus_free
          }
          cleanup_inner() {
            kill_pg "$PID1"
            kill_pg "$PID2"
            stop_app_instances
          }
          trap cleanup_inner EXIT

          DL_FILE="$APP_DATA/downloads/preview-$SEQ2/Legion-linux-x86_64.AppImage"

          # Launch 1: start seq1 in its own process group and wait for verified download + persisted prefs.
          PATH="$WORK/bin:$PATH" \
          LEGION_HOME="$WORK/node" \
          APPIMAGE_EXTRACT_AND_RUN=1 \
          WEBKIT_DISABLE_DMABUF_RENDERER=1 \
          WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            setsid "$WORK/run/Legion.AppImage" >"$DIAG/run1.log" 2>&1 &
          PID1=$!
          wait_for_download "Phase 1" 120

          # Launch 2: next-start auto-install replaces Legion.AppImage atomically and relaunches seq2.
          PATH="$WORK/bin:$PATH" \
          LEGION_HOME="$WORK/node" \
          APPIMAGE_EXTRACT_AND_RUN=1 \
          WEBKIT_DISABLE_DMABUF_RENDERER=1 \
          WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            setsid "$WORK/run/Legion.AppImage" >"$DIAG/run2.log" 2>&1 &
          PID2=$!
          verify_updated "Phase 1" 120

          # Phase 2: Explicitly verify that starting a second instance while an update is in
          # progress exits cleanly (code 0), stages at most one copy, and does not break the swap.
          echo "=== Phase 2: concurrent second start during Linux AppImage update ==="
          rm -rf "$APP_DATA"
          cp "$WORK/Legion-seq1.AppImage" "$WORK/run/Legion.AppImage"
          chmod 755 "$WORK/run/Legion.AppImage"

          PATH="$WORK/bin:$PATH" \
          LEGION_HOME="$WORK/node" \
          APPIMAGE_EXTRACT_AND_RUN=1 \
          WEBKIT_DISABLE_DMABUF_RENDERER=1 \
          WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            setsid "$WORK/run/Legion.AppImage" >"$DIAG/phase2-run1.log" 2>&1 &
          PID1=$!
          wait_for_download "Phase 2" 120

          PATH="$WORK/bin:$PATH" \
          LEGION_HOME="$WORK/node" \
          APPIMAGE_EXTRACT_AND_RUN=1 \
          WEBKIT_DISABLE_DMABUF_RENDERER=1 \
          WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            setsid "$WORK/run/Legion.AppImage" >"$DIAG/phase2-run2a.log" 2>&1 &
          PID2=$!

          SAW_LOCK=0
          SECOND_RC=-1
          MAX_STAGED=0
          for _ in $(seq 1 600); do
            if [ -f "$APP_DATA/update.lock" ]; then
              SAW_LOCK=1
              staged_now="$(find "$WORK/run" -maxdepth 1 -name '.Legion.AppImage.new-*' 2>/dev/null | wc -l | tr -d '[:space:]')"
              if [ "$staged_now" -gt "$MAX_STAGED" ]; then MAX_STAGED="$staged_now"; fi
              PATH="$WORK/bin:$PATH" \
              LEGION_HOME="$WORK/node" \
              APPIMAGE_EXTRACT_AND_RUN=1 \
              WEBKIT_DISABLE_DMABUF_RENDERER=1 \
              WEBKIT_DISABLE_COMPOSITING_MODE=1 \
                "$WORK/run/Legion.AppImage" >"$DIAG/phase2-run2b.log" 2>&1 &
              SECOND_PID=$!
              for _ in $(seq 1 120); do
                if ! kill -0 "$SECOND_PID" 2>/dev/null; then
                  break
                fi
                sleep 0.25
              done
              if kill -0 "$SECOND_PID" 2>/dev/null; then
                kill -9 "$SECOND_PID" 2>/dev/null || true
                fail "Phase 2 concurrent second instance hung for >30s during active update"
              fi
              set +e
              wait "$SECOND_PID"
              SECOND_RC=$?
              set -e
              staged_after="$(find "$WORK/run" -maxdepth 1 -name '.Legion.AppImage.new-*' 2>/dev/null | wc -l | tr -d '[:space:]')"
              if [ "$staged_after" -gt "$MAX_STAGED" ]; then MAX_STAGED="$staged_after"; fi
              break
            fi
            if [ -f "$APP_DATA/started-$SEQ2.ok" ]; then
              break
            fi
            sleep 0.1
          done
          echo "Phase 2 lock_seen=$SAW_LOCK second_rc=$SECOND_RC max_staged=$MAX_STAGED"
          [ "$SAW_LOCK" -eq 1 ] || fail "Phase 2 never observed update.lock before update finished"
          [ "$SECOND_RC" -eq 0 ] || fail "Phase 2 concurrent second instance exited with code $SECOND_RC (expected 0)"
          [ "$MAX_STAGED" -le 1 ] || fail "Phase 2 staged $MAX_STAGED AppImages simultaneously (expected <= 1)"

          verify_updated "Phase 2" 120
          INNER
          chmod +x "$WORK/run-appimage-test.sh"
          WORK="$WORK" DIAG="$DIAG" APP_DATA="$APP_DATA" SEQ1="$SEQ1" SEQ2="$SEQ2" \
            dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" "$WORK/run-appimage-test.sh"
      - name: Upload Linux self-update diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-linux-self-update-diag
          path: ci-diag/linux-self-update/
          if-no-files-found: ignore

  ios:
    name: iOS and iPadOS
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'ios'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and iOS targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: legion-app-tauri-cli-${{ runner.os }}-2.12.6-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: legion-app-tauri-cli-${{ runner.os }}-2.12.6-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/legion-app/src-tauri/target/
          key: legion-app-ios-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'apps/legion-app/src-tauri/Cargo.lock') }}
          restore-keys: legion-app-ios-${{ runner.os }}-
      - name: Install tauri-cli 2.12.6
        run: |
          set -euo pipefail
          if [ "$(cargo tauri --version 2>/dev/null || true)" != "tauri-cli 2.12.6" ]; then
            cargo install tauri-cli --version =2.12.6 --locked
          fi
      - name: Build iOS debug simulator app
        working-directory: apps/legion-app
        run: |
          set -euo pipefail
          rm -rf src-tauri/gen/apple/build
          export LEGION_BUILD_SEQUENCE="$(date -u +%Y%m%d%H%M)"
          # Xcode's build service does not forward arbitrary shell env vars to Run Script phases,
          # so pass LEGION_BUILD_SEQUENCE via the gitignored gen/apple/.build-env read by "Build Rust Code".
          trap 'rm -f src-tauri/gen/apple/.build-env' EXIT
          printf 'LEGION_BUILD_SEQUENCE=%s\n' "$LEGION_BUILD_SEQUENCE" > src-tauri/gen/apple/.build-env
          cargo tauri ios build --debug --target aarch64-sim --no-sign --ci 2>&1 | tee "$RUNNER_TEMP/ios-sim-build.log"
          SIM_APP="$(find src-tauri/gen/apple/build -maxdepth 4 -name 'Legion.app' | head -n 1)"
          test -d "$SIM_APP"
          node ../../scripts/make-update-set.mjs check-artifact \
            --file "$SIM_APP" \
            --kind app-bundle \
            --sequence "$LEGION_BUILD_SEQUENCE" \
            --forbid-preview-key \
            --build-log "$RUNNER_TEMP/ios-sim-build.log"
      - name: Build local legion node binary for iOS simulator content-media check
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/ios-node-target" cargo build --locked --bin legion
      - name: Boot iPhone and iPad simulators, verify ready marker, content media and capture screenshots
        run: |
          set -euo pipefail
          SIM_APP="$(find apps/legion-app/src-tauri/gen/apple/build -maxdepth 4 -name 'Legion.app' | head -n 1)"
          LEGION_BIN="$RUNNER_TEMP/ios-node-target/debug/legion"
          test -d "$SIM_APP"
          test -x "$LEGION_BIN"
          echo "Using simulator app: $SIM_APP"

          mkdir -p ci-shots/ios

          read -r IPHONE_UDID IPHONE_NAME IPAD_UDID IPAD_NAME < <(python3 - << 'PY'
          import json, re, subprocess, sys

          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"], text=True))
          def runtime_key(rt):
              return [int(x) for x in re.findall(r'\d+', rt)]

          ios_runtimes = sorted(
              [rt for rt in data.get("devices", {}) if "SimRuntime.iOS-" in rt],
              key=runtime_key,
              reverse=True,
          )
          for rt in ios_runtimes:
              devs = [d for d in data["devices"][rt] if d.get("isAvailable")]
              iphones = [d for d in devs if d["name"].startswith("iPhone")]
              ipads = [d for d in devs if d["name"].startswith("iPad")]
              if iphones and ipads:
                  iphones.sort(key=lambda d: (0 if "Pro" not in d["name"] and "SE" not in d["name"] and "e" not in d["name"].split()[-1] else 1, d["name"]))
                  ipads.sort(key=lambda d: (0 if "Air" in d["name"] or "Pro" in d["name"] else 1, d["name"]))
                  ip = iphones[0]
                  pd = ipads[0]
                  print(ip["udid"], ip["name"].replace(" ", "_"), pd["udid"], pd["name"].replace(" ", "_"))
                  sys.exit(0)
          sys.exit("No available iOS simulator runtime with both iPhone and iPad devices found.")
          PY
          )

          echo "Selected iPhone: $IPHONE_NAME ($IPHONE_UDID)"
          echo "Selected iPad: $IPAD_NAME ($IPAD_UDID)"

          # A simulator on a loaded runner can take well over half a minute to hand back a picture.
          # Each attempt is bounded, and three failed attempts fail the job with a clear message.
          shoot() {
            local udid="$1" out="$2" attempt
            for attempt in 1 2 3; do
              if perl -e 'alarm 90; exec @ARGV' xcrun simctl io "$udid" screenshot "$out" && [ -s "$out" ]; then
                return 0
              fi
              echo "screenshot attempt $attempt for $out did not finish in time; trying again" >&2
              rm -f "$out"
              sleep 5
            done
            echo "could not take $out after three attempts" >&2
            return 1
          }

          run_simulator_once() {
            local kind="$1"
            local udid="$2"
            local dev_name="$3"
            local attempt="$4"

            echo "=== Running on $kind ($dev_name / $udid) [attempt $attempt/2] ==="
            xcrun simctl boot "$udid" || true
            if ! perl -e 'alarm 480; exec @ARGV' xcrun simctl bootstatus "$udid" -b; then
              echo "Simulator $kind ($udid) failed to boot on attempt $attempt" >&2
              xcrun simctl shutdown "$udid" || true
              return 2
            fi
            xcrun simctl install "$udid" "$SIM_APP" || return 1

            local data_dir ready_file media_work media_spec media_out stdout_log stderr_log
            data_dir="$(xcrun simctl get_app_container "$udid" com.x1f4r.legion data)" || return 1
            mkdir -p "$data_dir/tmp" || return 1
            ready_file="$data_dir/tmp/legion-ready.txt"
            media_work="$RUNNER_TEMP/ios-media-${kind}"
            media_spec="$data_dir/tmp/media-check.json"
            media_out="$data_dir/tmp/media-result.json"
            stdout_log="$RUNNER_TEMP/legion-${kind}-stdout.log"
            stderr_log="$RUNNER_TEMP/legion-${kind}-stderr.log"
            rm -rf "$media_work" "$ready_file" "$media_spec" "$media_out" "$stdout_log" "$stderr_log"

            node scripts/ci-media-fixture.mjs ssh \
              --work "$media_work" \
              --legion "$LEGION_BIN" \
              --host 127.0.0.1 \
              --verify-resume \
              --out "$media_out" >/dev/null || return 1
            cp "$media_work/media-check.json" "$media_spec" || return 1

            xcrun simctl ui "$udid" appearance dark || true
            local launch_out app_pid
            launch_out="$(SIMCTL_CHILD_LEGION_APP_READY_FILE="$ready_file" \
              SIMCTL_CHILD_LEGION_APP_MEDIA_CHECK_FILE="$media_spec" \
              SIMCTL_CHILD_LEGION_APP_ALLOW_LOOPBACK_ENDPOINTS=1 \
              xcrun simctl launch --stdout="$stdout_log" --stderr="$stderr_log" "$udid" com.x1f4r.legion)" || {
              echo "Failed to launch Legion on $kind simulator (attempt $attempt)" >&2
              if [ -f "$media_work/sshd.pid" ]; then kill "$(cat "$media_work/sshd.pid")" 2>/dev/null || true; fi
              xcrun simctl shutdown "$udid" || true
              return 2
            }
            echo "$launch_out"
            app_pid="$(printf '%s\n' "$launch_out" | awk '{print $2}')"

            local found=0
            local media_ok=0
            local media_failed=0
            local resume_ok=0
            local app_exited=0
            for i in $(seq 1 90); do
              if [ "$found" -eq 0 ]; then
                if [ -f "$ready_file" ] && grep -q "legion-app: interface ready" "$ready_file"; then
                  echo "$kind interface ready (file) after ${i}s: $(cat "$ready_file")"
                  found=1
                elif [ -f "$stdout_log" ] && grep -q "legion-app: interface ready" "$stdout_log"; then
                  echo "$kind interface ready (stdout) after ${i}s"
                  found=1
                fi
              fi
              if [ "$media_ok" -eq 0 ] && [ -f "$media_out" ]; then
                cat "$media_out"
                if node -e 'const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); process.exit(r.ok && r.image_width > 0 && r.video_width > 0 && r.ipc_isolation_ok === true ? 0 : 1);' "$media_out"; then
                  media_ok=1
                else
                  media_failed=1
                  break
                fi
              fi
              if [ "$found" -eq 1 ] && [ "$media_ok" -eq 1 ]; then
                break
              fi
              if [ -n "$app_pid" ] && ! kill -0 "$app_pid" 2>/dev/null; then
                echo "$kind app process $app_pid exited after ${i}s"
                app_exited=1
                break
              fi
              sleep 1
            done

            if [ "$found" -eq 1 ] && [ "$media_ok" -eq 1 ]; then
              if bash scripts/ios-sim-resume.sh \
                --kind "$kind" \
                --udid "$udid" \
                --media-out "$media_out" \
                --app-pid "$app_pid" \
                --cycles 3 \
                --wait-secs 30 \
                --frontmost-timeout 20; then
                resume_ok=1
              else
                media_failed=1
              fi
            fi

            if [ -f "$media_work/sshd.pid" ]; then
              kill "$(cat "$media_work/sshd.pid")" 2>/dev/null || true
            fi
            echo "--- $kind stdout ---"
            cat "$stdout_log" || true
            echo "--- $kind stderr ---"
            cat "$stderr_log" || true
            if [ "$found" -ne 1 ] || [ "$media_ok" -ne 1 ] || [ "$resume_ok" -ne 1 ]; then
              local missing_stage="unknown"
              if [ "$app_exited" -eq 1 ]; then
                missing_stage="app process exited before initial check completed"
              elif [ "$found" -ne 1 ]; then
                missing_stage="interface ready"
              elif [ "$media_ok" -ne 1 ]; then
                missing_stage="initial media check"
              else
                missing_stage="post-resume check"
              fi
              echo "Failed $kind at stage: $missing_stage (ready=$found, media_check=$media_ok, resume=$resume_ok)"
              if [ -f "$media_out" ]; then
                echo "--- $kind media-result.json ---"
                cat "$media_out" || true
              fi
              cat "$media_work/sshd.log" || true
              ls -la "$data_dir/Library/Application Support" || true
              xcrun simctl io "$udid" screenshot "ci-shots/ios/${kind}-timeout.png" || true
              echo "--- DiagnosticReports ---"
              ls -lt "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | head -n 20 || true
              local latest_crash
              latest_crash="$(ls -t "$HOME/Library/Logs/DiagnosticReports"/Legion* 2>/dev/null | head -n 1 || true)"
              if [ -n "$latest_crash" ]; then
                echo "=== Crash report: $latest_crash ==="
                head -n 160 "$latest_crash" || true
              fi
              echo "--- CoreSimulator logs ---"
              xcrun simctl spawn "$udid" log show --last 3m --style compact --predicate 'eventMessage CONTAINS "Legion" OR eventMessage CONTAINS "com.x1f4r.legion"' | tail -n 100 || true
              xcrun simctl terminate "$udid" com.x1f4r.legion || true
              xcrun simctl shutdown "$udid" || true
              if [ "$found" -eq 0 ] && [ "$media_failed" -eq 0 ]; then
                return 2
              fi
              return 1
            fi

            # Confirm the app data directory is excluded from iCloud/iTunes backups.
            local app_data_dir="$data_dir/Library/Application Support/com.x1f4r.legion"
            test -d "$app_data_dir" || return 1
            swift - "$app_data_dir" << 'SWIFT' || return 1
          import Foundation
          let path = CommandLine.arguments[1]
          let url = URL(fileURLWithPath: path)
          let values = try url.resourceValues(forKeys: [.isExcludedFromBackupKey])
          guard values.isExcludedFromBackup == true else {
              fputs("Expected isExcludedFromBackup == true for \(path), got \(String(describing: values.isExcludedFromBackup))\n", stderr)
              exit(1)
          }
          print("Verified isExcludedFromBackup == true for \(path)")
          SWIFT

            sleep 2
            shoot "$udid" "ci-shots/ios/${kind}-dark.png" || return 1

            xcrun simctl ui "$udid" appearance light || true
            sleep 2
            shoot "$udid" "ci-shots/ios/${kind}-light.png" || return 1

            xcrun simctl terminate "$udid" com.x1f4r.legion || true
            xcrun simctl shutdown "$udid" || true
            return 0
          }

          run_simulator() {
            local kind="$1"
            local udid="$2"
            local dev_name="$3"
            local rc=0
            run_simulator_once "$kind" "$udid" "$dev_name" 1 || rc=$?
            if [ "$rc" -eq 0 ]; then
              return 0
            fi
            if [ "$rc" -eq 2 ]; then
              echo "Retrying $kind simulator once after cold-boot/launch stall..." >&2
              sleep 3
              run_simulator_once "$kind" "$udid" "$dev_name" 2
              return $?
            fi
            return "$rc"
          }

          run_simulator iphone "$IPHONE_UDID" "$IPHONE_NAME"
          run_simulator ipad "$IPAD_UDID" "$IPAD_NAME"
          ls -lh ci-shots/ios/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-ios-screenshots
          path: ci-shots/ios/*.png
          if-no-files-found: error
      - id: build_ipa
        name: Build unsigned iOS device IPA
        working-directory: apps/legion-app
        run: |
          set -euo pipefail
          rm -rf src-tauri/gen/apple/build
          export LEGION_BUILD_SEQUENCE="$(date -u +%Y%m%d%H%M)"
          trap 'rm -f src-tauri/gen/apple/.build-env' EXIT
          printf 'LEGION_BUILD_SEQUENCE=%s\n' "$LEGION_BUILD_SEQUENCE" > src-tauri/gen/apple/.build-env
          cargo tauri ios build --target aarch64 --no-sign --ci 2>&1 | tee "$RUNNER_TEMP/ios-ipa-build.log"
          IPA_COUNT="$(find src-tauri/gen/apple/build -maxdepth 4 -type f -name '*.ipa' | wc -l | tr -d '[:space:]')"
          test "$IPA_COUNT" -eq 1
          IPA_PATH="$(find src-tauri/gen/apple/build -maxdepth 4 -type f -name '*.ipa' | head -n 1)"
          test -s "$IPA_PATH"
          IPA_UNPACK="$RUNNER_TEMP/ios-ipa-check"
          rm -rf "$IPA_UNPACK"
          unzip -q "$IPA_PATH" -d "$IPA_UNPACK"
          IOS_BIN="$(find "$IPA_UNPACK/Payload" -maxdepth 2 -type f -perm -111 | head -n 1)"
          test -f "$IOS_BIN"
          node ../../scripts/check-binary-paths.mjs \
            "$IOS_BIN" \
            --no-defaults \
            --forbid LEGION_APP_READY_FILE \
            --forbid LEGION_APP_MEDIA_CHECK_FILE \
            --forbid LEGION_APP_TEST_QUIT_CONFIRM \
            --forbid LEGION_APP_ALLOW_LOOPBACK_ENDPOINTS \
            --forbid LEGION_CONTENT_LOG \
            --forbid transfer_upload_test_files \
            --forbid allow-loopback-endpoints \
            --forbid legion-content:
          mkdir -p ../../ci-artifacts
          cp "$IPA_PATH" ../../ci-artifacts/Legion-ios-unsigned.ipa
          node ../../scripts/make-update-set.mjs check-artifact \
            --file ../../ci-artifacts/Legion-ios-unsigned.ipa \
            --kind ipa \
            --sequence "$LEGION_BUILD_SEQUENCE" \
            --forbid-preview-key \
            --build-log "$RUNNER_TEMP/ios-ipa-build.log"
          ls -lh ../../ci-artifacts/Legion-ios-unsigned.ipa
          echo "ipa_path=ci-artifacts/Legion-ios-unsigned.ipa" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-ios-unsigned-ipa
          path: ${{ steps.build_ipa.outputs.ipa_path }}
          if-no-files-found: error

  macos-desktop:
    name: macOS desktop bundle
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'macos-desktop'
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: legion-app-tauri-cli-${{ runner.os }}-2.12.6-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: legion-app-tauri-cli-${{ runner.os }}-2.12.6-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/legion-app/src-tauri/target/
          key: legion-app-macos-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'apps/legion-app/src-tauri/Cargo.lock') }}
          restore-keys: legion-app-macos-${{ runner.os }}-
      - name: Install tauri-cli 2.12.6
        run: |
          set -euo pipefail
          if [ "$(cargo tauri --version 2>/dev/null || true)" != "tauri-cli 2.12.6" ]; then
            cargo install tauri-cli --version =2.12.6 --locked
          fi
      - name: Run unit tests on macOS (including Apple backup exclusion)
        run: cargo test --manifest-path apps/legion-app/src-tauri/Cargo.toml --locked
      - id: build
        name: Build Apple Silicon app and dmg (ad-hoc signed)
        working-directory: apps/legion-app
        run: |
          set -euo pipefail
          rm -rf src-tauri/target/release/bundle
          export LEGION_BUILD_SEQUENCE="$(date -u +%Y%m%d%H%M)"
          BASE_VER="$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' src-tauri/Cargo.toml)"
          CFG="$(node ../../scripts/make-update-set.mjs tauri-config --os macos --version "$BASE_VER" --sequence "$LEGION_BUILD_SEQUENCE")"
          cargo tauri build --bundles app,dmg --config "$CFG" 2>&1 | tee "$RUNNER_TEMP/macos-build.log"
          ls -lh src-tauri/target/release/bundle/macos/ src-tauri/target/release/bundle/dmg/
          APP_COUNT="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' | wc -l | tr -d '[:space:]')"
          DMG_COUNT="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d '[:space:]')"
          test "$APP_COUNT" -eq 1
          test "$DMG_COUNT" -eq 1
          APP_FILE="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' | head -n 1)"
          DMG_FILE="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          node ../../scripts/make-update-set.mjs check-artifact \
            --file "$APP_FILE" \
            --kind app-bundle \
            --sequence "$LEGION_BUILD_SEQUENCE" \
            --forbid-preview-key \
            --build-log "$RUNNER_TEMP/macos-build.log"
          DMG_MNT="$RUNNER_TEMP/dmg-verify"
          mkdir -p "$DMG_MNT"
          hdiutil detach "$DMG_MNT" -force >/dev/null 2>&1 || true
          trap 'hdiutil detach "$DMG_MNT" -force >/dev/null 2>&1 || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$DMG_MNT" "$DMG_FILE"
          DMG_APP="$(find "$DMG_MNT" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -d "$DMG_APP"
          node ../../scripts/make-update-set.mjs check-artifact \
            --file "$DMG_APP" \
            --kind app-bundle \
            --sequence "$LEGION_BUILD_SEQUENCE" \
            --forbid-preview-key \
            --build-log "$RUNNER_TEMP/macos-build.log"
          echo "app_path=apps/legion-app/${APP_FILE#./}" >> "$GITHUB_OUTPUT"
          echo "dmg_path=apps/legion-app/${DMG_FILE#./}" >> "$GITHUB_OUTPUT"
      - name: Launch macOS app, verify window, ready marker and content media decoding
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.build.outputs.app_path }}"
          test -d "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH" || codesign --force --deep --sign - "$APP_PATH"
          EXEC_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          EXEC_PATH="$APP_PATH/Contents/MacOS/$EXEC_NAME"
          test -x "$EXEC_PATH"

          node scripts/check-binary-paths.mjs \
            "$EXEC_PATH" \
            --no-defaults \
            --forbid LEGION_APP_READY_FILE \
            --forbid LEGION_APP_MEDIA_CHECK_FILE \
            --forbid LEGION_APP_TEST_QUIT_CONFIRM \
            --forbid LEGION_APP_ALLOW_LOOPBACK_ENDPOINTS \
            --forbid LEGION_CONTENT_LOG \
            --forbid transfer_upload_test_files \
            --forbid allow-loopback-endpoints \
            --forbid legion-content:

          MEDIA_WORK="$RUNNER_TEMP/macos-media"
          rm -rf "$MEDIA_WORK"
          mkdir -p "$MEDIA_WORK/bin"
          CARGO_TARGET_DIR="$RUNNER_TEMP/macos-node-target" cargo build --locked --bin legion
          cp "$RUNNER_TEMP/macos-node-target/debug/legion" "$MEDIA_WORK/bin/legion"
          chmod 755 "$MEDIA_WORK/bin/legion"
          node scripts/ci-media-fixture.mjs local \
            --work "$MEDIA_WORK" \
            --legion "$MEDIA_WORK/bin/legion" \
            --out "$MEDIA_WORK/result.json" >/dev/null

          READY_FILE="$RUNNER_TEMP/legion-macos-ready.txt"
          REL_LOG="$RUNNER_TEMP/legion-macos-release.log"
          rm -f "$READY_FILE" "$REL_LOG" "$MEDIA_WORK/result.json"
          mkdir -p ci-shots/macos

          PATH="$MEDIA_WORK/bin:$PATH" \
          LEGION_HOME="$MEDIA_WORK/node" \
          LEGION_APP_READY_FILE="$READY_FILE" \
          LEGION_APP_MEDIA_CHECK_FILE="$MEDIA_WORK/media-check.json" \
          LEGION_CONTENT_LOG=1 \
            "$EXEC_PATH" >"$REL_LOG" 2>&1 &
          APP_PID=$!

          FOUND=0
          EXITED_EARLY=0
          for i in $(seq 1 60); do
            if [ "$FOUND" -eq 0 ] && [ -f "$REL_LOG" ] && grep -q "legion-app: interface ready" "$REL_LOG"; then
              echo "macOS desktop release ready (stdout) after ${i}s"
              FOUND=1
              sleep 2
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "ERROR: macOS desktop release app (PID $APP_PID) exited early after ${i}s"
              EXITED_EARLY=1
              break
            fi
            sleep 1
          done

          if [ "$FOUND" -eq 1 ]; then
            perl -e 'alarm 20; exec @ARGV' swift - "$APP_PID" << 'SWIFT' || echo "macOS window check timed out or skipped"
          import CoreGraphics
          import Foundation
          let pid = Int32(CommandLine.arguments[1]) ?? -1
          let windows = (CGWindowListCopyWindowInfo([.optionAll], kCGNullWindowID) as? [[String: Any]]) ?? []
          let mine = windows.filter { ($0[kCGWindowOwnerPID as String] as? Int32) == pid }
          print("macOS windows for PID \(pid): \(mine.count)")
          for w in mine {
              print("  name=\(w[kCGWindowName as String] ?? "") bounds=\(w[kCGWindowBounds as String] ?? "")")
          }
          SWIFT

            perl -e 'alarm 20; exec @ARGV' screencapture -x ci-shots/macos/macos-desktop.png \
              || echo "macOS screencapture timed out or skipped"
          fi

          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true
          cat "$REL_LOG" || true
          if [ "$FOUND" -ne 1 ]; then
            if [ "$EXITED_EARLY" -ne 1 ]; then
              echo "ERROR: Timed out waiting for macOS release ready"
            fi
            exit 1
          fi
          if [ -e "$READY_FILE" ]; then
            echo "ERROR: macOS release build unexpectedly honored LEGION_APP_READY_FILE"
            exit 1
          fi
          if [ -f "$MEDIA_WORK/result.json" ]; then
            echo "ERROR: macOS release build unexpectedly honored LEGION_APP_MEDIA_CHECK_FILE"
            exit 1
          fi

          # Verify content media decoding + HTML/SVG IPC isolation using the debug binary.
          cargo build --manifest-path apps/legion-app/src-tauri/Cargo.toml --locked
          rm -f "$READY_FILE" "$MEDIA_WORK/result.json"
          PATH="$MEDIA_WORK/bin:$PATH" \
          LEGION_HOME="$MEDIA_WORK/node" \
          LEGION_APP_READY_FILE="$READY_FILE" \
          LEGION_APP_MEDIA_CHECK_FILE="$MEDIA_WORK/media-check.json" \
            apps/legion-app/src-tauri/target/debug/legion-app >"$RUNNER_TEMP/legion-macos.log" 2>&1 &
          DBG_PID=$!
          MEDIA_OK=0
          for i in $(seq 1 60); do
            if [ -f "$MEDIA_WORK/result.json" ]; then
              cat "$MEDIA_WORK/result.json"
              node -e 'const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (!r.ok || r.image_width <= 0 || r.video_width <= 0 || r.ipc_isolation_ok !== true) process.exit(1);' "$MEDIA_WORK/result.json"
              MEDIA_OK=1
              break
            fi
            if ! kill -0 "$DBG_PID" 2>/dev/null; then
              echo "ERROR: macOS debug app (PID $DBG_PID) exited early after ${i}s"
              break
            fi
            sleep 1
          done
          kill "$DBG_PID" 2>/dev/null || true
          wait "$DBG_PID" 2>/dev/null || true
          cat "$RUNNER_TEMP/legion-macos.log" || true
          if [ "$MEDIA_OK" -ne 1 ]; then
            echo "ERROR: macOS debug content media check failed"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-macos-dmg
          path: ${{ steps.build.outputs.dmg_path }}
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-macos-screenshots
          path: ci-shots/macos/*.png
          if-no-files-found: ignore
      - name: Verify macOS self-update from local node (preview key)
        run: |
          set -euo pipefail
          WORK="$HOME/.cache/legion-ci-update-test"
          DIAG="$PWD/ci-diag/macos-self-update"
          APP_DATA="$HOME/Library/Application Support/com.x1f4r.legion/updates"
          rm -rf "$WORK" "$DIAG" "$APP_DATA"
          mkdir -p "$WORK/bin" "$WORK/run" "$WORK/node" "$DIAG"
          chmod 700 "$WORK"

          PID1=""
          PID2=""
          FAIL_REASON=""
          EXEC_PATH=""
          fail() {
            FAIL_REASON="$*"
            echo "FAIL (macOS self-update): $FAIL_REASON" >&2
            exit 1
          }
          count_app_instances() {
            [ -n "$EXEC_PATH" ] || { echo 0; return 0; }
            ps -A -w -w -o stat=,args= | awk -v exe="$EXEC_PATH" '
              $1 !~ /Z/ {
                line = $0
                sub(/^[[:space:]]*[^[:space:]]+[[:space:]]+/, "", line)
                if (line == exe || index(line, exe " ") == 1) c++
              }
              END { print c + 0 }
            '
          }
          stop_app_instances() {
            local sig
            [ -n "$PID1" ] && { kill "$PID1" 2>/dev/null || true; wait "$PID1" 2>/dev/null || true; PID1=""; }
            [ -n "$PID2" ] && { kill "$PID2" 2>/dev/null || true; wait "$PID2" 2>/dev/null || true; PID2=""; }
            for sig in TERM KILL; do
              pkill "-$sig" -f "$WORK/run/Legion.app" 2>/dev/null || true
              for _ in $(seq 1 20); do
                if [ "$(count_app_instances)" -eq 0 ]; then
                  return 0
                fi
                sleep 0.25
              done
            done
          }
          dump_diag() {
            local rc=$?
            set +e
            {
              echo "=== macOS self-update diagnostics (exit=$rc, reason=${FAIL_REASON:-none}) ==="
              echo "--- ps aux ---"
              ps aux
              echo "--- $APP_DATA tree ---"
              find "$APP_DATA" -maxdepth 4 -ls 2>/dev/null || true
              echo "--- $WORK/run tree ---"
              ls -la "$WORK/run" 2>/dev/null || true
            } > "$DIAG/summary.txt"
            [ -n "$PID1" ] && kill "$PID1" 2>/dev/null || true
            [ -n "$PID2" ] && kill "$PID2" 2>/dev/null || true
            pkill -f "$WORK/run/Legion.app" 2>/dev/null || true
            rm -rf apps/legion-app/src-tauri/target/release/bundle
            for f in prefs.json floor.json current-build.json last-state.json supervisor.log supervisor-script.sh.txt new-start.log rollback-ps.txt update.lock; do
              [ -f "$APP_DATA/$f" ] && cp "$APP_DATA/$f" "$DIAG/$f"
            done
            for f in "$APP_DATA"/rollback-*.json "$APP_DATA"/deferred-*.json "$APP_DATA"/started-*.ok; do
              [ -f "$f" ] && cp "$f" "$DIAG/$(basename "$f")"
            done
            if [ "$rc" -ne 0 ]; then
              if [ -z "$FAIL_REASON" ]; then
                echo "FAIL (macOS self-update): unexpected command failure (exit=$rc)" >&2
              fi
              for f in "$DIAG"/*; do
                [ -f "$f" ] || continue
                echo "===== DIAG $(basename "$f") ====="
                cat "$f" || true
              done
            fi
            exit "$rc"
          }
          trap dump_diag EXIT

          node scripts/make-update-set.mjs keygen \
            --key "$WORK/preview.key" \
            --public-key "$WORK/preview.pub.pem"

          LEGION_PREVIEW_UPDATE_KEY="$WORK/preview.pub.pem" \
          CARGO_TARGET_DIR="$WORK/node-target" \
            cargo build --release --locked --bin legion
          cp "$WORK/node-target/release/legion" "$WORK/bin/legion"
          chmod 755 "$WORK/bin/legion"

          SEQ1="$(node -e 'import("./scripts/make-update-set.mjs").then(m => console.log(m.currentSequence(new Date(Date.now() - 10 * 60_000))))')"
          SEQ2="$(node scripts/make-update-set.mjs sequence)"
          if [ "$SEQ2" -le "$SEQ1" ]; then SEQ2="$((SEQ1 + 1))"; fi

          rm -rf apps/legion-app/src-tauri/target/release/bundle
          CFG1="$(node scripts/make-update-set.mjs tauri-config --os macos --version 0.1.0 --sequence "$SEQ1")"
          (
            cd apps/legion-app
            LEGION_PREVIEW_UPDATE_KEY="$WORK/preview.pub.pem" \
            LEGION_BUILD_SEQUENCE="$SEQ1" \
            LEGION_BUILD_REV="seq-$SEQ1" \
              cargo tauri build --bundles app --config "$CFG1"
          )
          APP1="$(find apps/legion-app/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)"
          cp -R "$APP1" "$WORK/Legion-seq1.app"
          codesign --force --deep --sign - "$WORK/Legion-seq1.app"
          cp -R "$WORK/Legion-seq1.app" "$WORK/run/Legion.app"

          rm -rf apps/legion-app/src-tauri/target/release/bundle
          CFG2="$(node scripts/make-update-set.mjs tauri-config --os macos --version 0.1.1 --sequence "$SEQ2")"
          (
            cd apps/legion-app
            LEGION_PREVIEW_UPDATE_KEY="$WORK/preview.pub.pem" \
            LEGION_BUILD_SEQUENCE="$SEQ2" \
            LEGION_BUILD_REV="seq-$SEQ2" \
              cargo tauri build --bundles app --config "$CFG2"
          )
          APP2="$(find apps/legion-app/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)"
          codesign --force --deep --sign - "$APP2"
          tar -czf "$WORK/Legion-macos-aarch64.app.tar.gz" -C "$(dirname "$APP2")" "$(basename "$APP2")"

          node scripts/make-update-set.mjs create \
            --out "$WORK/set-2" \
            --channel preview \
            --version 0.1.1 \
            --build "seq-$SEQ2" \
            --sequence "$SEQ2" \
            --notes "CI macOS self-update verification." \
            --key "$WORK/preview.key" \
            --artifact "$WORK/Legion-macos-aarch64.app.tar.gz:program=app,os=macos,arch=aarch64,kind=app-tar,name=Legion-macos-aarch64.app.tar.gz"

          LEGION_HOME="$WORK/node" "$WORK/bin/legion" init --name tower >/dev/null
          LEGION_HOME="$WORK/node" "$WORK/bin/legion" update.publish "from=$WORK/set-2" --json
          LEGION_HOME="$WORK/node" "$WORK/bin/legion" update.list --json > "$DIAG/node-update-list.json"

          EXEC_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$WORK/run/Legion.app/Contents/Info.plist")"
          EXEC_PATH="$WORK/run/Legion.app/Contents/MacOS/$EXEC_NAME"
          DL_FILE="$APP_DATA/downloads/preview-$SEQ2/Legion-macos-aarch64.app.tar.gz"

          wait_for_download() {
            local phase="$1" timeout="$2" downloaded=0 i has_cur=0 has_dl=0 has_part=0 has_prefs=0
            for i in $(seq 1 "$timeout"); do
              if [ $((i % 10)) -eq 0 ]; then
                {
                  echo "=== ${phase} run1 t=${i}s ==="
                  cat "$APP_DATA/last-state.json" 2>/dev/null || echo "(no last-state.json)"
                } >> "$DIAG/poll-trace.log"
              fi
              if [ -f "$APP_DATA/current-build.json" ] && grep -q "\"sequence\": $SEQ1" "$APP_DATA/current-build.json" \
                 && [ -f "$DL_FILE" ] && [ ! -f "$DL_FILE.part" ] \
                 && [ -f "$APP_DATA/prefs.json" ] && grep -q "\"sequence\": $SEQ2" "$APP_DATA/prefs.json"; then
                downloaded=1
                break
              fi
              sleep 1
            done
            stop_app_instances
            if [ "$downloaded" -ne 1 ]; then
              [ -f "$APP_DATA/current-build.json" ] && grep -q "\"sequence\": $SEQ1" "$APP_DATA/current-build.json" && has_cur=1
              [ -f "$DL_FILE" ] && has_dl=1
              [ -f "$DL_FILE.part" ] && has_part=1
              [ -f "$APP_DATA/prefs.json" ] && grep -q "\"sequence\": $SEQ2" "$APP_DATA/prefs.json" && has_prefs=1
              fail "$phase download did not complete within ${timeout}s (current_seq1=$has_cur dl_file=$has_dl dl_part=$has_part prefs_seq2=$has_prefs)"
            fi
          }

          verify_updated() {
            local phase="$1" timeout="$2" updated=0 i
            local has_marker=0 has_cur2=0 backup_gone=0 lock_gone=0 instances=0 rollback_files=""
            for i in $(seq 1 "$timeout"); do
              if [ $((i % 10)) -eq 0 ]; then
                {
                  echo "=== ${phase} run2 t=${i}s ==="
                  cat "$APP_DATA/last-state.json" 2>/dev/null || echo "(no last-state.json)"
                  cat "$APP_DATA/supervisor.log" 2>/dev/null || echo "(no supervisor.log)"
                  [ -f "$APP_DATA/new-start.log" ] && cat "$APP_DATA/new-start.log" || true
                } >> "$DIAG/poll-trace.log"
              fi
              if [ -f "$APP_DATA/started-$SEQ2.ok" ] \
                 && [ -f "$APP_DATA/current-build.json" ] \
                 && grep -q "\"sequence\": $SEQ2" "$APP_DATA/current-build.json" \
                 && [ ! -e "$WORK/run/.Legion.app.prev" ] \
                 && [ ! -e "$APP_DATA/update.lock" ]; then
                updated=1
                break
              fi
              sleep 1
            done
            if [ "$updated" -ne 1 ]; then
              [ -f "$APP_DATA/started-$SEQ2.ok" ] && has_marker=1
              [ -f "$APP_DATA/current-build.json" ] && grep -q "\"sequence\": $SEQ2" "$APP_DATA/current-build.json" && has_cur2=1
              [ ! -e "$WORK/run/.Legion.app.prev" ] && backup_gone=1
              [ ! -e "$APP_DATA/update.lock" ] && lock_gone=1
              instances="$(count_app_instances)"
              fail "$phase update did not complete within ${timeout}s (started_marker=$has_marker current_seq2=$has_cur2 backup_gone=$backup_gone lock_gone=$lock_gone running_instances=$instances)"
            fi
            instances="$(count_app_instances)"
            if [ "$instances" -ne 1 ]; then
              for _ in $(seq 1 10); do
                sleep 0.5
                instances="$(count_app_instances)"
                if [ "$instances" -eq 1 ]; then break; fi
              done
            fi
            [ "$instances" -eq 1 ] || fail "$phase expected exactly 1 running instance of $EXEC_PATH after update, found $instances"
            [ ! -e "$WORK/run/.Legion.app.prev" ] || fail "$phase backup bundle .Legion.app.prev still present after update"
            [ ! -e "$APP_DATA/update.lock" ] || fail "$phase update.lock still present after update"
            rollback_files="$(find "$APP_DATA" -maxdepth 1 -name 'rollback-*.json' -print 2>/dev/null | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
            [ -z "$rollback_files" ] || fail "$phase produced unexpected rollback file(s): $rollback_files"
            cat "$APP_DATA/current-build.json" || true
            stop_app_instances
          }

          PATH="$WORK/bin:$PATH" LEGION_HOME="$WORK/node" "$EXEC_PATH" >"$DIAG/run1.log" 2>&1 &
          PID1=$!
          wait_for_download "Phase 1" 120

          # Second launch triggers immediate next-start auto-install and atomic bundle swap.
          PATH="$WORK/bin:$PATH" LEGION_HOME="$WORK/node" "$EXEC_PATH" >"$DIAG/run2.log" 2>&1 &
          PID2=$!
          verify_updated "Phase 1" 120

          # Phase 2: Explicitly verify that starting a second instance while an update is in
          # progress exits cleanly (code 0), stages at most one copy, and does not break the swap.
          echo "=== Phase 2: concurrent second start during macOS update ==="
          rm -rf "$APP_DATA" "$WORK/run/Legion.app"
          cp -R "$WORK/Legion-seq1.app" "$WORK/run/Legion.app"

          PATH="$WORK/bin:$PATH" LEGION_HOME="$WORK/node" "$EXEC_PATH" >"$DIAG/phase2-run1.log" 2>&1 &
          PID1=$!
          wait_for_download "Phase 2" 120

          PATH="$WORK/bin:$PATH" LEGION_HOME="$WORK/node" "$EXEC_PATH" >"$DIAG/phase2-run2a.log" 2>&1 &
          PID2=$!

          SAW_LOCK=0
          SECOND_RC=-1
          MAX_STAGED=0
          for _ in $(seq 1 600); do
            if [ -f "$APP_DATA/update.lock" ]; then
              SAW_LOCK=1
              staged_now="$(find "$WORK/run" -maxdepth 1 -name '.Legion.app.new-*' 2>/dev/null | wc -l | tr -d '[:space:]')"
              if [ "$staged_now" -gt "$MAX_STAGED" ]; then MAX_STAGED="$staged_now"; fi
              PATH="$WORK/bin:$PATH" LEGION_HOME="$WORK/node" "$EXEC_PATH" >"$DIAG/phase2-run2b.log" 2>&1 &
              SECOND_PID=$!
              for _ in $(seq 1 120); do
                if ! kill -0 "$SECOND_PID" 2>/dev/null; then
                  break
                fi
                sleep 0.25
              done
              if kill -0 "$SECOND_PID" 2>/dev/null; then
                kill -9 "$SECOND_PID" 2>/dev/null || true
                fail "Phase 2 concurrent second macOS instance hung for >30s during active update"
              fi
              set +e
              wait "$SECOND_PID"
              SECOND_RC=$?
              set -e
              staged_after="$(find "$WORK/run" -maxdepth 1 -name '.Legion.app.new-*' 2>/dev/null | wc -l | tr -d '[:space:]')"
              if [ "$staged_after" -gt "$MAX_STAGED" ]; then MAX_STAGED="$staged_after"; fi
              break
            fi
            if [ -f "$APP_DATA/started-$SEQ2.ok" ]; then
              break
            fi
            sleep 0.1
          done
          echo "Phase 2 macOS lock_seen=$SAW_LOCK second_rc=$SECOND_RC max_staged=$MAX_STAGED"
          [ "$SAW_LOCK" -eq 1 ] || fail "Phase 2 never observed update.lock before update finished"
          [ "$SECOND_RC" -eq 0 ] || fail "Phase 2 concurrent second macOS instance exited with code $SECOND_RC (expected 0)"
          [ "$MAX_STAGED" -le 1 ] || fail "Phase 2 staged $MAX_STAGED bundles simultaneously (expected <= 1)"

          verify_updated "Phase 2" 120
      - name: Upload macOS self-update diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-macos-self-update-diag
          path: ci-diag/macos-self-update/
          if-no-files-found: ignore

  windows-desktop:
    name: Windows desktop installer
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'windows-desktop'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: legion-app-tauri-cli-${{ runner.os }}-2.12.6-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: legion-app-tauri-cli-${{ runner.os }}-2.12.6-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/legion-app/src-tauri/target/
          key: legion-app-windows-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'apps/legion-app/src-tauri/Cargo.lock') }}
          restore-keys: legion-app-windows-${{ runner.os }}-
      - name: Install tauri-cli 2.12.6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (& cargo tauri --version 2>$null)
          if ($ver -ne 'tauri-cli 2.12.6') {
            cargo install tauri-cli --version =2.12.6 --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run unit tests on Windows (including rollback file-lock protection)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --manifest-path apps/legion-app/src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - id: build
        name: Build NSIS installer
        working-directory: apps/legion-app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath 'src-tauri\target\release\bundle' -Recurse -Force -ErrorAction SilentlyContinue
          $seq = (node ..\..\scripts\make-update-set.mjs sequence).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:LEGION_BUILD_SEQUENCE = $seq
          $baseVer = ((Get-Content -LiteralPath src-tauri\Cargo.toml) | Where-Object { $_ -match '^version\s*=' } | Select-Object -First 1) -replace '^[^"]*"([^"]+)".*$', '$1'
          $cfg = (node ..\..\scripts\make-update-set.mjs tauri-config --os windows --version $baseVer --sequence $seq)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $buildLog = Join-Path $env:RUNNER_TEMP 'windows-build.log'
          $prevEap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          & cargo tauri build --bundles nsis --config $cfg 2>&1 | Tee-Object -FilePath $buildLog
          $buildExit = $LASTEXITCODE
          $ErrorActionPreference = $prevEap
          if ($buildExit -ne 0) { exit $buildExit }
          Get-ChildItem src-tauri\target\release\bundle\nsis\
          $exes = @(Get-ChildItem -Path 'src-tauri\target\release\bundle\nsis' -Filter '*.exe' -File)
          if ($exes.Count -ne 1) { throw "Expected exactly 1 NSIS installer, found $($exes.Count)." }
          $nsis = $exes[0]
          node ..\..\scripts\make-update-set.mjs check-artifact `
            --file src-tauri\target\release\legion-app.exe `
            --kind binary `
            --sequence $seq `
            --forbid-preview-key `
            --build-log $buildLog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ..\..\scripts\make-update-set.mjs check-artifact `
            --file $nsis.FullName `
            --kind nsis `
            --sequence $seq `
            --forbid-preview-key `
            --build-log $buildLog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "nsis_path=apps/legion-app/src-tauri/target/release/bundle/nsis/$($nsis.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Silently install NSIS package, launch app, verify ready marker and content media decoding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mediaWork = Join-Path $env:RUNNER_TEMP 'windows-media'
          $mediaBin = Join-Path $mediaWork 'bin'
          Remove-Item -LiteralPath $mediaWork -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $mediaBin -Force | Out-Null

          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'windows-node-target'
          cargo build --locked --bin legion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $legionExe = Join-Path $mediaBin 'legion.exe'
          Copy-Item -LiteralPath (Join-Path $env:CARGO_TARGET_DIR 'debug\legion.exe') -Destination $legionExe -Force
          Remove-Item Env:CARGO_TARGET_DIR -ErrorAction SilentlyContinue

          $mediaOut = Join-Path $mediaWork 'result.json'
          node scripts/ci-media-fixture.mjs local --work $mediaWork --legion $legionExe --out $mediaOut | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $nsis = Get-Item -LiteralPath '${{ steps.build.outputs.nsis_path }}'
          if (-not $nsis) { throw 'NSIS installer not found.' }
          Write-Host "Installing $($nsis.FullName) silently..."

          $installDir = Join-Path $env:RUNNER_TEMP 'legion-install'
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          $instProc = Start-Process -FilePath $nsis.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($instProc.ExitCode -ne 0) { throw "NSIS silent install exited with $($instProc.ExitCode)" }

          $exe = Get-ChildItem -Path $installDir -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) {
            Write-Host "Installed files:"
            Get-ChildItem -Path $installDir -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw 'Installed Legion executable not found.'
          }
          Write-Host "Checking installed release executable for forbidden debug switches: $($exe.FullName)"
          node scripts/check-binary-paths.mjs $exe.FullName --no-defaults `
            --forbid LEGION_APP_READY_FILE `
            --forbid LEGION_APP_MEDIA_CHECK_FILE `
            --forbid LEGION_APP_TEST_QUIT_CONFIRM `
            --forbid LEGION_APP_ALLOW_LOOPBACK_ENDPOINTS `
            --forbid LEGION_CONTENT_LOG `
            --forbid transfer_upload_test_files `
            --forbid allow-loopback-endpoints `
            --forbid legion-content:
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "Launching installed executable: $($exe.FullName)"

          $readyFile = Join-Path $env:RUNNER_TEMP 'legion-windows-ready.txt'
          $relStdout = Join-Path $env:RUNNER_TEMP 'legion-windows-release.out.log'
          $relStderr = Join-Path $env:RUNNER_TEMP 'legion-windows-release.err.log'
          Remove-Item -LiteralPath $readyFile, $relStdout, $relStderr, $mediaOut -Force -ErrorAction SilentlyContinue
          $env:PATH = "$mediaBin;$env:PATH"
          $env:LEGION_HOME = Join-Path $mediaWork 'node'
          $env:LEGION_APP_READY_FILE = $readyFile
          $env:LEGION_APP_MEDIA_CHECK_FILE = Join-Path $mediaWork 'media-check.json'
          $env:LEGION_CONTENT_LOG = '1'

          $appProc = Start-Process -FilePath $exe.FullName -RedirectStandardOutput $relStdout -RedirectStandardError $relStderr -PassThru
          $found = $false
          for ($i = 1; $i -le 60; $i++) {
            if (-not $found -and (Test-Path -LiteralPath $relStdout)) {
              $outText = Get-Content -LiteralPath $relStdout -Raw -ErrorAction SilentlyContinue
              if ($outText -and ($outText -match 'legion-app: interface ready')) {
                Write-Host "Windows desktop release ready (stdout) after ${i}s"
                $found = $true
                Start-Sleep -Seconds 2
                break
              }
            }
            if ($appProc.HasExited) {
              throw "Legion Windows process exited early with code $($appProc.ExitCode)"
            }
            Start-Sleep -Seconds 1
          }

          $appProc.Refresh()
          Write-Host "MainWindowTitle='$($appProc.MainWindowTitle)' MainWindowHandle=$($appProc.MainWindowHandle)"

          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $gfx = [System.Drawing.Graphics]::FromImage($bmp)
            $gfx.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            New-Item -ItemType Directory -Path 'ci-shots\windows' -Force | Out-Null
            $bmp.Save('ci-shots\windows\windows-desktop.png', [System.Drawing.Imaging.ImageFormat]::Png)
            $gfx.Dispose()
            $bmp.Dispose()
          } catch {
            Write-Host "Screenshot capture skipped: $_"
          }

          if (-not $appProc.HasExited) {
            Stop-Process -Id $appProc.Id -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path -LiteralPath $relStdout) { Get-Content -LiteralPath $relStdout }
          if (Test-Path -LiteralPath $relStderr) { Get-Content -LiteralPath $relStderr }
          if (-not $found) {
            throw 'Timed out waiting for Windows release ready marker on stdout'
          }
          if (Test-Path -LiteralPath $readyFile) {
            throw 'Windows release binary unexpectedly honored LEGION_APP_READY_FILE'
          }
          if (Test-Path -LiteralPath $mediaOut) {
            throw 'Windows release binary unexpectedly honored LEGION_APP_MEDIA_CHECK_FILE'
          }

          # Verify content media decoding + HTML/SVG IPC isolation using the debug binary.
          cargo build --manifest-path apps/legion-app/src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -LiteralPath $readyFile, $mediaOut -Force -ErrorAction SilentlyContinue
          $dbgProc = Start-Process -FilePath 'apps\legion-app\src-tauri\target\debug\legion-app.exe' -PassThru
          $mediaOk = $false
          for ($i = 1; $i -le 60; $i++) {
            if (Test-Path -LiteralPath $mediaOut) {
              $raw = Get-Content -LiteralPath $mediaOut -Raw
              Write-Host "Windows content media report: $raw"
              $rep = $raw | ConvertFrom-Json
              if (-not $rep.ok -or $rep.image_width -le 0 -or $rep.video_width -le 0 -or -not $rep.ipc_isolation_ok) {
                throw "Windows content media check failed: $raw"
              }
              $mediaOk = $true
              break
            }
            if ($dbgProc.HasExited) {
              throw "Legion Windows debug process exited early with code $($dbgProc.ExitCode)"
            }
            Start-Sleep -Seconds 1
          }
          if (-not $dbgProc.HasExited) {
            Stop-Process -Id $dbgProc.Id -Force -ErrorAction SilentlyContinue
          }
          if (-not $mediaOk) {
            throw 'Timed out waiting for Windows debug content media check'
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-windows-nsis
          path: ${{ steps.build.outputs.nsis_path }}
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-windows-screenshots
          path: ci-shots/windows/*.png
          if-no-files-found: ignore
      - name: Verify Windows self-update from local node (preview key)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:LOCALAPPDATA 'legion-ci-update-test'
          $diag = Join-Path (Get-Location).Path 'ci-diag\windows-self-update'
          $appUpdates = Join-Path $env:LOCALAPPDATA 'com.x1f4r.legion\updates'
          Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $diag -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $appUpdates -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path (Join-Path $work 'bin'), (Join-Path $work 'install'), (Join-Path $work 'node'), $diag -Force | Out-Null

          $installDir = Join-Path $work 'install'
          $pollTrace = Join-Path $diag 'poll-trace.log'
          $failed = $false
          $failReason = ''

          function Dump-Diagnostics([bool]$printToConsole, [string]$reason) {
            $summaryLines = New-Object System.Collections.Generic.List[string]
            $summaryLines.Add("=== Windows self-update diagnostics (reason=$(if ($reason) { $reason } else { 'none' })) ===")
            $summaryLines.Add("--- Processes ---")
            Get-Process | Sort-Object ProcessName | ForEach-Object {
              $pPath = ''
              try { $pPath = $_.Path } catch {}
              if ($_.ProcessName -match 'legion|powershell|pwsh|setup|nsis|msedgewebview2') {
                $summaryLines.Add("pid=$($_.Id) name=$($_.ProcessName) path=$pPath")
              }
            }
            $summaryLines.Add("--- $appUpdates tree ---")
            if (Test-Path -LiteralPath $appUpdates) {
              Get-ChildItem -LiteralPath $appUpdates -Recurse -Force | ForEach-Object {
                $summaryLines.Add("$($_.Mode) $($_.Length) $($_.FullName)")
              }
            } else {
              $summaryLines.Add('(missing)')
            }
            $summaryLines.Add("--- $installDir tree ---")
            if (Test-Path -LiteralPath $installDir) {
              Get-ChildItem -LiteralPath $installDir -Recurse -Force | ForEach-Object {
                $summaryLines.Add("$($_.Mode) $($_.Length) $($_.FullName)")
              }
            }
            Set-Content -LiteralPath (Join-Path $diag 'summary.txt') -Value ($summaryLines -join "`n") -Encoding UTF8

            foreach ($name in @('prefs.json', 'floor.json', 'current-build.json', 'last-state.json', 'supervisor.log', 'supervisor-script.ps1.txt', 'new-start.log', 'rollback-ps.txt', 'update.lock')) {
              $src = Join-Path $appUpdates $name
              if (Test-Path -LiteralPath $src) {
                Copy-Item -LiteralPath $src -Destination (Join-Path $diag $name) -Force -ErrorAction SilentlyContinue
              }
            }
            if (Test-Path -LiteralPath $appUpdates) {
              Get-ChildItem -LiteralPath $appUpdates -Force | Where-Object { $_.Name -like 'rollback-*.json' -or $_.Name -like 'deferred-*.json' -or $_.Name -like 'started-*.ok' } | ForEach-Object {
                Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $diag $_.Name) -Force -ErrorAction SilentlyContinue
              }
            }
            if ($printToConsole) {
              Get-ChildItem -LiteralPath $diag -File | Sort-Object Name | ForEach-Object {
                Write-Host "===== DIAG $($_.Name) ====="
                Get-Content -LiteralPath $_.FullName -Raw -ErrorAction SilentlyContinue | Write-Host
              }
            }
          }

          try {
            $privKey = Join-Path $work 'preview.key'
            $pubKey = Join-Path $work 'preview.pub.pem'
            node scripts/make-update-set.mjs keygen --key $privKey --public-key $pubKey
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $env:LEGION_PREVIEW_UPDATE_KEY = $pubKey
            $env:CARGO_TARGET_DIR = Join-Path $work 'node-target'
            cargo build --release --locked --bin legion
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $legionBin = Join-Path $work 'bin\legion.exe'
            Copy-Item -LiteralPath (Join-Path $work 'node-target\release\legion.exe') -Destination $legionBin -Force
            Remove-Item Env:CARGO_TARGET_DIR -ErrorAction SilentlyContinue

            $seq1 = [int64](node -e 'import("./scripts/make-update-set.mjs").then(m => console.log(m.currentSequence(new Date(Date.now() - 10 * 60_000))))').Trim()
            $seq2 = [int64](node scripts/make-update-set.mjs sequence).Trim()
            if ($seq2 -le $seq1) { $seq2 = $seq1 + 1 }

            Remove-Item -LiteralPath 'apps\legion-app\src-tauri\target\release\bundle' -Recurse -Force -ErrorAction SilentlyContinue
            $cfg1 = (node scripts/make-update-set.mjs tauri-config --os windows --version 0.1.0 --sequence $seq1)
            Push-Location apps/legion-app
            try {
              $env:LEGION_BUILD_SEQUENCE = "$seq1"
              $env:LEGION_BUILD_REV = "seq-$seq1"
              cargo tauri build --bundles nsis --config $cfg1
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally { Pop-Location }
            $nsis1 = Get-ChildItem -Path 'apps\legion-app\src-tauri\target\release\bundle\nsis' -Filter '*.exe' | Select-Object -First 1
            if (-not $nsis1) { throw 'NSIS seq1 installer not found.' }
            $installer1 = Join-Path $work 'Legion-seq1-setup.exe'
            Copy-Item -LiteralPath $nsis1.FullName -Destination $installer1 -Force

            Remove-Item -LiteralPath 'apps\legion-app\src-tauri\target\release\bundle' -Recurse -Force -ErrorAction SilentlyContinue
            $cfg2 = (node scripts/make-update-set.mjs tauri-config --os windows --version 0.1.1 --sequence $seq2)
            Push-Location apps/legion-app
            try {
              $env:LEGION_BUILD_SEQUENCE = "$seq2"
              $env:LEGION_BUILD_REV = "seq-$seq2"
              cargo tauri build --bundles nsis --config $cfg2
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally { Pop-Location }
            $nsis2 = Get-ChildItem -Path 'apps\legion-app\src-tauri\target\release\bundle\nsis' -Filter '*.exe' | Select-Object -First 1
            if (-not $nsis2) { throw 'NSIS seq2 installer not found.' }
            $installer2 = Join-Path $work 'Legion-windows-x86_64-setup.exe'
            Copy-Item -LiteralPath $nsis2.FullName -Destination $installer2 -Force

            $setDir = Join-Path $work 'set-2'
            node scripts/make-update-set.mjs create `
              --out $setDir `
              --channel preview `
              --version 0.1.1 `
              --build "seq-$seq2" `
              --sequence $seq2 `
              --notes "CI Windows self-update verification." `
              --key $privKey `
              --artifact "${installer2}:program=app,os=windows,arch=x86_64,kind=nsis,name=Legion-windows-x86_64-setup.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $nodeHome = Join-Path $work 'node'
            $env:LEGION_HOME = $nodeHome
            & $legionBin init --name tower | Out-Null
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $legionBin update.publish "from=$setDir" --json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            (& $legionBin update.list --json) | Set-Content -LiteralPath (Join-Path $diag 'node-update-list.json') -Encoding UTF8

            $instProc = Start-Process -FilePath $installer1 -ArgumentList "/S /D=$installDir" -Wait -PassThru
            if ($instProc.ExitCode -ne 0) { throw "NSIS seq1 install failed: $($instProc.ExitCode)" }
            $exe = Get-ChildItem -Path $installDir -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
            if (-not $exe) { throw 'Installed seq1 Legion executable not found.' }

            $env:PATH = "$(Join-Path $work 'bin');$env:PATH"
            $currentJson = Join-Path $appUpdates 'current-build.json'
            $prefsJson = Join-Path $appUpdates 'prefs.json'
            $lastStateJson = Join-Path $appUpdates 'last-state.json'
            $supLog = Join-Path $appUpdates 'supervisor.log'
            $newStartLog = Join-Path $appUpdates 'new-start.log'
            $updateLock = Join-Path $appUpdates 'update.lock'
            $startedMarker = Join-Path $appUpdates "started-$seq2.ok"
            $backupDir = Join-Path $appUpdates "backup-$seq1"
            $dlFile = Join-Path $appUpdates "downloads\preview-$seq2\Legion-windows-x86_64-setup.exe"

            function Get-AppInstances([string]$exePath) {
              @(Get-Process -ErrorAction SilentlyContinue | Where-Object {
                $p = $null
                try { $p = $_.Path } catch {}
                $p -and [string]::Equals($p, $exePath, [System.StringComparison]::OrdinalIgnoreCase)
              })
            }

            function Stop-AppInstances([string]$exePath) {
              Get-Process -ErrorAction SilentlyContinue | Where-Object {
                $p = $null
                try { $p = $_.Path } catch {}
                $p -and $p.StartsWith($installDir, [System.StringComparison]::OrdinalIgnoreCase)
              } | Stop-Process -Force -ErrorAction SilentlyContinue
              for ($w = 0; $w -lt 40; $w++) {
                if (@(Get-AppInstances $exePath).Count -eq 0) { break }
                Start-Sleep -Milliseconds 250
              }
            }

            function Wait-ForDownload([string]$phase, [int]$timeoutSecs, $launchProc, [string]$exePath) {
              $downloaded = $false
              for ($i = 1; $i -le $timeoutSecs; $i++) {
                if (($i % 10) -eq 0) {
                  Add-Content -LiteralPath $pollTrace -Value "=== $phase run1 t=${i}s ==="
                  if (Test-Path -LiteralPath $lastStateJson) {
                    Add-Content -LiteralPath $pollTrace -Value (Get-Content -LiteralPath $lastStateJson -Raw)
                  }
                }
                if ((Test-Path -LiteralPath $currentJson) -and ((Get-Content -LiteralPath $currentJson -Raw) -match "`"sequence`":\s*$seq1") -and (Test-Path -LiteralPath $dlFile) -and -not (Test-Path -LiteralPath "$dlFile.part") -and (Test-Path -LiteralPath $prefsJson) -and ((Get-Content -LiteralPath $prefsJson -Raw) -match "`"sequence`":\s*$seq2")) {
                  $downloaded = $true
                  break
                }
                Start-Sleep -Seconds 1
              }
              if ($launchProc -and -not $launchProc.HasExited) {
                Stop-Process -Id $launchProc.Id -Force -ErrorAction SilentlyContinue
                try { $launchProc.WaitForExit(5000) | Out-Null } catch {}
              }
              Stop-AppInstances $exePath
              if (-not $downloaded) {
                $hasCur = (Test-Path -LiteralPath $currentJson) -and ((Get-Content -LiteralPath $currentJson -Raw) -match "`"sequence`":\s*$seq1")
                $hasDl = Test-Path -LiteralPath $dlFile
                $hasPart = Test-Path -LiteralPath "$dlFile.part"
                $hasPrefs = (Test-Path -LiteralPath $prefsJson) -and ((Get-Content -LiteralPath $prefsJson -Raw) -match "`"sequence`":\s*$seq2")
                throw "$phase download did not complete within ${timeoutSecs}s (current_seq1=$hasCur dl_file=$hasDl dl_part=$hasPart prefs_seq2=$hasPrefs)"
              }
            }

            function Verify-Updated([string]$phase, [int]$timeoutSecs, [string]$exePath) {
              $updated = $false
              for ($i = 1; $i -le $timeoutSecs; $i++) {
                if (($i % 10) -eq 0) {
                  Add-Content -LiteralPath $pollTrace -Value "=== $phase run2 t=${i}s ==="
                  if (Test-Path -LiteralPath $lastStateJson) {
                    Add-Content -LiteralPath $pollTrace -Value (Get-Content -LiteralPath $lastStateJson -Raw)
                  }
                  if (Test-Path -LiteralPath $supLog) {
                    Add-Content -LiteralPath $pollTrace -Value (Get-Content -LiteralPath $supLog -Raw)
                  }
                  if (Test-Path -LiteralPath $newStartLog) {
                    Add-Content -LiteralPath $pollTrace -Value (Get-Content -LiteralPath $newStartLog -Raw)
                  }
                }
                if ((Test-Path -LiteralPath $startedMarker) -and (Test-Path -LiteralPath $currentJson) -and ((Get-Content -LiteralPath $currentJson -Raw) -match "`"sequence`":\s*$seq2") -and -not (Test-Path -LiteralPath $backupDir) -and -not (Test-Path -LiteralPath $updateLock)) {
                  $updated = $true
                  break
                }
                Start-Sleep -Seconds 1
              }
              if (-not $updated) {
                $hasMarker = Test-Path -LiteralPath $startedMarker
                $hasCur2 = (Test-Path -LiteralPath $currentJson) -and ((Get-Content -LiteralPath $currentJson -Raw) -match "`"sequence`":\s*$seq2")
                $backupGone = -not (Test-Path -LiteralPath $backupDir)
                $lockGone = -not (Test-Path -LiteralPath $updateLock)
                $instCount = @(Get-AppInstances $exePath).Count
                throw "$phase update did not complete within ${timeoutSecs}s (started_marker=$hasMarker current_seq2=$hasCur2 backup_gone=$backupGone lock_gone=$lockGone running_instances=$instCount)"
              }
              $instCount = @(Get-AppInstances $exePath).Count
              if ($instCount -ne 1) {
                for ($s = 0; $s -lt 10; $s++) {
                  Start-Sleep -Milliseconds 500
                  $instCount = @(Get-AppInstances $exePath).Count
                  if ($instCount -eq 1) { break }
                }
              }
              if ($instCount -ne 1) { throw "$phase expected exactly 1 running instance of $exePath after update, found $instCount" }
              if (Test-Path -LiteralPath $backupDir) { throw "$phase backup directory still exists after update: $backupDir" }
              if (Test-Path -LiteralPath $updateLock) { throw "$phase update.lock still exists after update" }
              $rollbacks = @(Get-ChildItem -LiteralPath $appUpdates -Filter 'rollback-*.json' -File -ErrorAction SilentlyContinue)
              if ($rollbacks.Count -ne 0) { throw "$phase produced unexpected rollback file(s): $($rollbacks.Name -join ', ')" }
              if (Test-Path -LiteralPath $currentJson) { Get-Content -LiteralPath $currentJson }
            }

            $proc1 = Start-Process -FilePath $exe.FullName -RedirectStandardOutput (Join-Path $diag 'run1-stdout.log') -RedirectStandardError (Join-Path $diag 'run1-stderr.log') -PassThru
            Wait-ForDownload 'Phase 1' 120 $proc1 $exe.FullName

            # Second launch triggers immediate next-start auto-install via silent NSIS upgrade.
            Start-Process -FilePath $exe.FullName -RedirectStandardOutput (Join-Path $diag 'run2-stdout.log') -RedirectStandardError (Join-Path $diag 'run2-stderr.log') | Out-Null
            Verify-Updated 'Phase 1' 120 $exe.FullName

            # Phase 2: Explicitly verify that starting a second instance while an update is in
            # progress exits cleanly (code 0), stages at most one installer, and does not break the
            # NSIS upgrade.
            Write-Host "=== Phase 2: concurrent second start during Windows NSIS update ==="
            Stop-AppInstances $exe.FullName
            Remove-Item -LiteralPath $appUpdates -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $installDir -Force | Out-Null

            $instProc2 = Start-Process -FilePath $installer1 -ArgumentList "/S /D=$installDir" -Wait -PassThru
            if ($instProc2.ExitCode -ne 0) { throw "Phase 2 NSIS seq1 install failed: $($instProc2.ExitCode)" }
            $exe = Get-ChildItem -Path $installDir -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
            if (-not $exe) { throw 'Phase 2 installed seq1 Legion executable not found.' }

            $p2Proc1 = Start-Process -FilePath $exe.FullName -RedirectStandardOutput (Join-Path $diag 'phase2-run1-stdout.log') -RedirectStandardError (Join-Path $diag 'phase2-run1-stderr.log') -PassThru
            Wait-ForDownload 'Phase 2' 120 $p2Proc1 $exe.FullName

            Start-Process -FilePath $exe.FullName -RedirectStandardOutput (Join-Path $diag 'phase2-run2a-stdout.log') -RedirectStandardError (Join-Path $diag 'phase2-run2a-stderr.log') | Out-Null
            $sawLock = $false
            $secondExit = -1
            $maxStaged = 0
            $verifiedDir = Join-Path $appUpdates 'verified'
            for ($k = 0; $k -lt 600; $k++) {
              if (Test-Path -LiteralPath $updateLock) {
                $sawLock = $true
                if (Test-Path -LiteralPath $verifiedDir) {
                  $cnt = @(Get-ChildItem -LiteralPath $verifiedDir -Filter 'verified-*-setup.exe' -File -ErrorAction SilentlyContinue).Count
                  if ($cnt -gt $maxStaged) { $maxStaged = $cnt }
                }
                $proc2b = Start-Process -FilePath $exe.FullName -RedirectStandardOutput (Join-Path $diag 'phase2-run2b-stdout.log') -RedirectStandardError (Join-Path $diag 'phase2-run2b-stderr.log') -PassThru
                if (-not $proc2b.WaitForExit(30000)) {
                  Stop-Process -Id $proc2b.Id -Force -ErrorAction SilentlyContinue
                  throw 'Phase 2 second Windows instance hung during active update.'
                }
                $secondExit = $proc2b.ExitCode
                if (Test-Path -LiteralPath $verifiedDir) {
                  $cnt = @(Get-ChildItem -LiteralPath $verifiedDir -Filter 'verified-*-setup.exe' -File -ErrorAction SilentlyContinue).Count
                  if ($cnt -gt $maxStaged) { $maxStaged = $cnt }
                }
                break
              }
              if (Test-Path -LiteralPath $startedMarker) { break }
              Start-Sleep -Milliseconds 100
            }
            Write-Host "Phase 2 Windows lock_seen=$sawLock second_rc=$secondExit max_staged=$maxStaged"
            if (-not $sawLock) { throw 'Phase 2 never observed update.lock on Windows.' }
            if ($secondExit -ne 0) { throw "Phase 2 second Windows instance exited with code $secondExit (expected 0)." }
            if ($maxStaged -gt 1) { throw "Phase 2 staged $maxStaged installers (expected <= 1)." }

            Verify-Updated 'Phase 2' 120 $exe.FullName
          } catch {
            $failed = $true
            $failReason = $_.Exception.Message
            Write-Host "FAIL (Windows self-update): $failReason"
            throw
          } finally {
            Dump-Diagnostics $failed $failReason
            Get-Process -ErrorAction SilentlyContinue | Where-Object {
              $p = $null
              try { $p = $_.Path } catch {}
              $p -and $p.StartsWith($installDir, [System.StringComparison]::OrdinalIgnoreCase)
            } | Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath 'apps\legion-app\src-tauri\target\release\bundle' -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item Env:LEGION_PREVIEW_UPDATE_KEY -ErrorAction SilentlyContinue
          }
      - name: Upload Windows self-update diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-windows-self-update-diag
          path: ci-diag/windows-self-update/
          if-no-files-found: ignore
