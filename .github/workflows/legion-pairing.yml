name: Legion pairing
# Build static Linux binaries for both `legion` and `legion-link`'s CLI example, then verify the
# full SSH device-pairing flow (12-digit expiry-time, ssh-keyscan host keys, StrictModes yes,
# enrolment, gate enforcement, streamed exec.run, and revocation) against real OpenSSH 8.9
# (ubuntu:22.04) and OpenSSH 9.2 (debian:12) containers.
on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - scripts/pairing-openssh-test.sh
      - .github/workflows/legion-pairing.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - scripts/pairing-openssh-test.sh
      - .github/workflows/legion-pairing.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legion-pairing-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Every action is pinned to the commit of the release named beside it, matching checks.yml.
jobs:
  build-amd64:
    name: Build static Linux amd64 pairing binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and musl target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-pairing-amd64-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-pairing-amd64-
      - name: Install musl-tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends musl-tools
      - name: Build static legion and legion-link binaries (x86_64-unknown-linux-musl)
        shell: bash
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          LEGION_BUILD_REV: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target x86_64-unknown-linux-musl -p legion-cli
          cargo build --release --locked --target x86_64-unknown-linux-musl -p legion-link --features ssh --example link
          file target/x86_64-unknown-linux-musl/release/legion
          file target/x86_64-unknown-linux-musl/release/examples/link
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legion-pairing-amd64
          path: |
            target/x86_64-unknown-linux-musl/release/legion
            target/x86_64-unknown-linux-musl/release/examples/link
          if-no-files-found: error

  verify-openssh:
    name: Verify pairing (${{ matrix.image }})
    needs: build-amd64
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
          - image: debian:12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: legion-pairing-amd64
          path: target/pairing-artifact
      - name: Run OpenSSH pairing verification
        shell: bash
        run: |
          set -euo pipefail
          legion_bin="$(find target/pairing-artifact -type f -name 'legion' | head -n 1)"
          link_bin="$(find target/pairing-artifact -type f -name 'link' | head -n 1)"
          chmod 0755 "$legion_bin" "$link_bin"
          bash scripts/pairing-openssh-test.sh "${{ matrix.image }}" --bin "$legion_bin" --link-bin "$link_bin"
