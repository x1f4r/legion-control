name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent:
    name: Agent (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bash scripts/check.sh agent
  mac:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check.sh mac
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: bash scripts/check.sh android
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: bash scripts/check.sh desktop
      - name: Publish Linux
        if: runner.os == 'Linux'
        run: dotnet publish desktop/LegionControl.Desktop -c Release -r linux-x64 --self-contained true -o desktop/artifacts/linux-x64
      - name: Publish Windows
        if: runner.os == 'Windows'
        run: dotnet publish desktop/LegionControl.Desktop -c Release -r win-x64 --self-contained true -o desktop/artifacts/win-x64
      - name: Publish Linux ARM64
        if: runner.os == 'Linux'
        run: dotnet publish desktop/LegionControl.Desktop -c Release -r linux-arm64 --self-contained true -o desktop/artifacts/linux-arm64
