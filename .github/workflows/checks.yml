name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to a pull request makes the run still going on it moot, so that run is cancelled.
# Every push to main runs to the end in a group of its own: release.sh releases only a commit whose
# checks all passed, and a run that was cancelled, or left waiting behind a newer one, would leave
# that commit unreleasable.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Every action is pinned to the commit of the release named beside it, so a tag that moves cannot
# change what runs here. Dependabot (.github/dependabot.yml) proposes the updates.
jobs:
  agent:
    name: Agent (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # contract/test/transport-shells.test.mjs runs command lines through every shell an ssh
      # session can end in, and skips a shell that is not installed. The runner has sh and bash;
      # these are the other shells a Linux login can be.
      - name: Install dash, zsh and fish
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends dash zsh fish
      # On Windows this also runs agent/install/install-windows.ps1 for real and checks what it
      # installed and removed (tests/installer-windows.test.mjs), including the scheduled tasks it
      # registers, as the runner's user and as SYSTEM, which only a throwaway runner is given to
      # do. On Linux and macOS it renders the systemd units against a systemctl that only takes
      # notes, and uninstalls them again.
      - run: bash scripts/check.sh agent

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runners come with rustup, so the toolchain is installed through it rather than through an
      # action that would be one more thing to pin. rust-toolchain.toml names the release and its
      # components, so CI builds with the compiler a local checkout does.
      - name: Install Rust
        run: rustup toolchain install
      # Downloaded crates and what was built from them, for the compiler and the lock file they
      # were built with. A newer key starts from the nearest older one, and the workspace's own
      # crates are rebuilt on every run anyway.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # Formatting, clippy with warnings as errors, and the tests, as scripts/check.sh runs them. The
      # tests run the built binary under a LEGION_HOME of their own, so Windows is the one place its
      # paths, its locks and its line endings are exercised.
      - run: bash scripts/check.sh rust
      # Verify that the generated tool reference matches the built binary's registry.
      - name: Check generated Legion tool reference
        if: runner.os == 'Linux'
        run: node scripts/legion-tools-doc.mjs --bin target/debug/legion --check
      # Building each crate's tests on its own catches feature unification bugs where a crate only
      # compiles because another workspace member enabled a dependency feature.
      - name: Build each crate's tests alone
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          for dir in crates/*/; do
            crate="$(basename "$dir")"
            cargo test -p "$crate" --no-run --locked
          done
      # Check legion-link with all features (including the in-process SSH and local desktop pipes)
      # and verify the node binary does not pull russh in.
      - name: Check legion-link with all features
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo clippy -p legion-link --all-targets --all-features --locked -- -D warnings
          cargo test -p legion-link --all-features --locked
          if cargo tree -p legion-cli --locked | grep -qi russh; then
            echo "russh must not be in legion-cli's dependency tree" >&2
            exit 1
          fi
      # Cross-check legion-link with in-process SSH for Android targets using the runner's NDK.
      - name: Cross-check legion-link for Android
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            echo "Android NDK not found in ANDROID_NDK_LATEST_HOME or ANDROID_NDK_HOME" >&2
            exit 1
          fi
          toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          rustup target add aarch64-linux-android x86_64-linux-android
          CC_aarch64_linux_android="$toolchain/aarch64-linux-android24-clang" \
          AR_aarch64_linux_android="$toolchain/llvm-ar" \
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$toolchain/aarch64-linux-android24-clang" \
            cargo build --lib -p legion-link --no-default-features --locked --target aarch64-linux-android
          CC_aarch64_linux_android="$toolchain/aarch64-linux-android24-clang" \
          AR_aarch64_linux_android="$toolchain/llvm-ar" \
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$toolchain/aarch64-linux-android24-clang" \
            cargo build --lib -p legion-link --features ssh --locked --target aarch64-linux-android
          CC_x86_64_linux_android="$toolchain/x86_64-linux-android24-clang" \
          AR_x86_64_linux_android="$toolchain/llvm-ar" \
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$toolchain/x86_64-linux-android24-clang" \
            cargo build --lib -p legion-link --features ssh --locked --target x86_64-linux-android
      # Cross-check legion-link with in-process SSH for iOS device and simulator targets.
      - name: Cross-check legion-link for iOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            cargo build --lib -p legion-link --features ssh --locked --target aarch64-apple-ios
          IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            cargo build --lib -p legion-link --features ssh --locked --target aarch64-apple-ios-sim
      # Exercise the Unix install script's offline path against the freshly built binary, including
      # idempotent re-installation over an existing copy, inside a throwaway HOME.
      - name: Test install/legion.sh with --from
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          tmp_home="$(mktemp -d)"
          trap 'rm -rf "$tmp_home"' EXIT
          HOME="$tmp_home" sh install/legion.sh --from target/debug/legion
          HOME="$tmp_home" sh install/legion.sh --from target/debug/legion
          "$tmp_home/.local/bin/legion" --version
      # Exercise the Windows install script's offline path against the freshly built binary,
      # including idempotent replacement and non-duplicating user PATH updates.
      - name: Test install/legion.ps1 with -From
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tmpLocal = Join-Path ([System.IO.Path]::GetTempPath()) ('legion-ci-install-' + [Guid]::NewGuid().ToString('N'))
          $null = New-Item -ItemType Directory -Path $tmpLocal -Force
          try {
            $env:LOCALAPPDATA = $tmpLocal
            ./install/legion.ps1 -From target/debug/legion.exe
            ./install/legion.ps1 -From target/debug/legion.exe
            & (Join-Path $tmpLocal 'legion\legion.exe') --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -LiteralPath $tmpLocal -Recurse -Force -ErrorAction SilentlyContinue
          }

  private-data:
    name: Private data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The agent legs run this too, without the private terms. Here they come from a repository
      # secret, which a pull request from a fork does not get; the check then says it had none and
      # still looks for home directories and addresses. It never prints a term.
      - run: node scripts/check-private-data.mjs
        env:
          LEGION_PRIVATE_TERMS: ${{ secrets.LEGION_PRIVATE_TERMS }}

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every shell script in the repository; android/gradlew, which Gradle writes, has no .sh.
      - run: |
          shellcheck --version
          git ls-files -z -- '*.sh' | xargs -0 shellcheck -S warning

  powershell:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned like the actions: a new release of the analyser brings new rules, and those should
      # arrive in a change of their own rather than fail an unrelated one.
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
      - shell: pwsh
        run: |
          Import-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0
          ./scripts/check-powershell.ps1

  mac:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/check.sh mac

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The wrapper jar is the one binary in the repository that runs code, so it has to be a jar
      # Gradle published.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/app/*.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The action's default today, spelled out so that a later default cannot change what
          # is installed.
          packages: platform-tools
      - run: bash scripts/check.sh android

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('desktop/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: bash scripts/check.sh desktop
      # The release dry run publishes all three archives the way a release does. This is the
      # Windows build published on Windows, which a release never does.
      - name: Publish Windows
        if: runner.os == 'Windows'
        run: dotnet publish desktop/LegionControl.Desktop -c Release -r win-x64 --self-contained true -o desktop/artifacts/win-x64

  # What release.sh builds, built the same way, short of the release keys: the APK and its release
  # lint, signed with a key made for the run; the three desktop archives, checked the way release.sh
  # checks them; and the Mac bundle, ad hoc signed and not installed. Nothing here reads a secret,
  # and no build carries the signed agent bundle, which only the release key can make. A change
  # that would break a release fails here, on the pull request that made it.
  release-android:
    name: Release dry run (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/app/*.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # As in the Android job: the default today, spelled out.
          packages: platform-tools
      - name: Build and lint the release APK, unsigned
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease :app:lintRelease --console=plain
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      # android/build-apk.sh, which release.sh runs, aligns and signs that APK. With no key in
      # ~/.legion-control it makes one, which this runner throws away with everything else.
      - name: Sign it the way a release does
        run: LEGION_ANDROID_JAVA_HOME="$JAVA_HOME" bash android/build-apk.sh

  release-desktop:
    name: Release dry run (desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('desktop/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build the desktop archives and check them
        run: |
          bash desktop/build.sh all
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' desktop/LegionControl.Desktop/LegionControl.Desktop.csproj | head -1)"
          node scripts/verify-desktop-artifacts.mjs "$version" dist

  release-mac:
    name: Release dry run (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the Mac app without installing it
        run: bash mac/build.sh --no-install

  ui-browser:
    name: UI browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Rust
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-release-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-
      - name: Build release legion binary
        run: cargo build --release --locked --bin legion
      - name: Install browser test driver
        run: npm --prefix apps/ui/test ci
      - name: Run headless browser end-to-end test
        run: node --test apps/ui/test/browser.test.mjs
