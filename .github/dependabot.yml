# Updates for what the builds and CI pull in from elsewhere: the pinned actions, the Rust
# workspace's Cargo dependencies, and the UI browser test driver. Each ecosystem comes as one
# pull request a week, which CI checks like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /apps/ui/test
    schedule:
      interval: weekly
    groups:
      ui-test:
        patterns: ['*']
