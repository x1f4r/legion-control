[package]
name = "legion-os"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Platform-specific process, file, and locking primitives for Legion"

[dependencies]
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "process", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
