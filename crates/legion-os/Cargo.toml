[package]
name = "legion-os"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Platform-specific process, file, and locking primitives for Legion"

[dependencies]
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "std", "process-group", "process-session", "job-object", "creation-flags", "kill-on-drop"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7.20", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
nix = { version = "0.31.1", default-features = false, features = ["process", "signal", "user"] }
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = ["Wdk_System_SystemInformation", "Wdk_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Kernel", "Win32_System_Threading"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
harness = false
