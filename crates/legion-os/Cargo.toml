[package]
name = "legion-os"
description = "Platform-specific process, file, and locking primitives for Legion."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
webview2 = ["dep:webview2-com"]

[dependencies]
process-wrap = { workspace = true, features = ["tokio1", "std", "process-group", "process-session", "job-object", "creation-flags", "kill-on-drop"] }
serde.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "sync", "time"] }
tokio-util.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix = { workspace = true, features = ["process", "signal", "user"] }

[target.'cfg(windows)'.dependencies]
webview2-com = { version = "0.39.1", optional = true }
windows = { workspace = true, features = ["Wdk_System_SystemInformation", "Wdk_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Rpc", "Win32_System_StationsAndDesktops", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_Wmi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
harness = false

# Mirrors `[workspace.lints]` except `unsafe_code = "deny"` instead of `"forbid"` because Cargo
# cannot override a single lint when `workspace = true` is set, and this crate holds the documented
# platform FFI calls under targeted `#[allow(unsafe_code)]` blocks.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
result_large_err = "allow"
