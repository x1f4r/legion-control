[package]
name = "legion-doors"
description = "The doors programs come in through: MCP for AI agents and HTTP for everything else, over a node and a router."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
http-body.workspace = true
hyper.workspace = true
hyper-util.workspace = true
jiff.workspace = true
legion-core.workspace = true
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
# rt for the task tracker that lets a session wait for its cancelled calls to reach the audit log.
tokio-util = { workspace = true, features = ["rt"] }

[dev-dependencies]
legion-tools = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
