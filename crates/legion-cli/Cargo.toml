[package]
name = "legion-cli"
description = "The legion binary: the command line, the rpc session, and the wiring between them and a node."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "legion"
path = "src/main.rs"

[dependencies]
legion-core.workspace = true
legion-doors.workspace = true
legion-proto.workspace = true
legion-tools.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
legion-tools = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
