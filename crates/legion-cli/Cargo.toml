[package]
name = "legion-cli"
description = "The legion binary: the command line, the rpc session, and the wiring between them and a node."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
move-between-places = ["legion-net/move-between-places"]

[[bin]]
name = "legion"
path = "src/main.rs"

[dependencies]
legion-core.workspace = true
legion-doors.workspace = true
legion-net.workspace = true
legion-os.workspace = true
legion-proto.workspace = true
legion-tools.workspace = true
qrcode.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
legion-tools = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["time"] }

# Re-executes its own binary as cross-platform connector wrappers (setting LEGION_HOME per remote
# node, emitting banners, simulating disconnects) without relying on sh, env, or sleep.
[[test]]
name = "fleet"
harness = false

# Runs its own binary as the connector to second and third nodes, to cut, slow down or prefix a
# banner to their stream pipes.
[[test]]
name = "transfer"
harness = false

# Hosts extra nodes for its fan-out test by re-executing itself, as the fleet tests do.
[[test]]
name = "http"
harness = false

# Re-executes its own binary as the connector command of simulated machines (which system is up,
# which boot it is on) and as a long-running exclusive job.
[[test]]
name = "power"
harness = false

# Tests calling extension tools locally and on another node over the command connector.
[[test]]
name = "ext"
harness = false

# Re-executes itself as a cross-platform connector and fake agent CLI for init, agent, sync, and doctor tests.
[[test]]
name = "setup"
harness = false

[lints]
workspace = true
