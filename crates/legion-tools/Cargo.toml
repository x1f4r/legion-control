[package]
name = "legion-tools"
description = "The tool families built into Legion, one module per family."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Tools that exist only so the command line and the rpc session can be tested end to end: one that
# echoes its arguments, one that sleeps until cancelled, two that check a path. The CLI's tests turn
# it on through a dev-dependency, so a release build never carries them.
#
# It also swaps the power tools' actuator for a recording fake, whatever the environment says, so a
# test binary can never sleep, restart or wake a real machine (see power::actuator), and lets a test
# node's boot id be set from a file (legion-core's `testing`).
testing = ["legion-core/testing"]

[dependencies]
base64.workspace = true
blake3.workspace = true
dunce.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
globset.workspace = true
ignore.workspace = true
jiff.workspace = true
legion-core.workspace = true
legion-os.workspace = true
legion-proto.workspace = true
legion-xfer.workspace = true
regex.workspace = true
same-file.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "sync"] }
toml_edit.workspace = true

# sys.kill asks a Unix kernel whether a pid exists with signal 0, through nix's safe wrapper.
[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "signal"] }

# These re-execute their own binary as the child processes they need, so they cannot use the
# standard harness, which writes to stdout before any test code runs.
[[test]]
name = "exec"
harness = false

[[test]]
name = "ext"
harness = false

[[test]]
name = "job"
harness = false

[[test]]
name = "proj"
harness = false

[[test]]
name = "sys"
harness = false

[lints]
workspace = true
