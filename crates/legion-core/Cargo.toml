[package]
name = "legion-core"
description = "A Legion node: the tool registry, the context a tool runs in, policy, audit, configuration and paths."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Lets a test node report the boot id written in the file LEGION_TEST_BOOT_ID_FILE names, so a test
# can make a node look restarted without restarting anything. legion-tools turns it on with its own
# `testing` feature; a release build never has it.
testing = []

[dependencies]
dunce.workspace = true
gethostname.workspace = true
jiff.workspace = true
legion-os.workspace = true
legion-proto.workspace = true
same-file.workspace = true
schemars.workspace = true
serde.workspace = true
serde_ignored.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tokio-util.workspace = true
toml.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
